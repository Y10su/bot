<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرنين في الأعمدة الهوائية والأوتار</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @media print {
            @page {
                size: A4;
                margin: 2cm;
            }
            
            body {
                font-size: 14pt;
                line-height: 1.6;
                font-family: 'Amiri', serif;
            }
            
            .cover-page {
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            
            .no-print {
                display: none !important;
            }
        }
        
        body {
            font-family: 'Amiri', 'Noto Sans Arabic', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .cover-container {
            background: white;
            padding: 3cm;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        
        .main-title {
            color: #1e40af;
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 1em;
            border-bottom: 3px solid #1e40af;
            padding-bottom: 0.5em;
        }
        
        .subject {
            color: #374151;
            font-size: 1.8em;
            margin-bottom: 0.5em;
        }
        
        .student-info {
            background: #f0f9ff;
            padding: 1.5em;
            margin: 1.5em 0;
            border-right: 4px solid #3b82f6;
            border-radius: 10px;
        }
        
        .info-item {
            font-size: 1.4em;
            margin: 0.8em 0;
            color: #1e40af;
        }
        
        .class-info {
            background: #fef7ff;
            padding: 1em;
            margin: 1em 0;
            border-right: 4px solid #8b5cf6;
            border-radius: 8px;
            font-size: 1.3em;
            color: #7c3aed;
        }
        
        .year {
            color: #059669;
            font-size: 1.2em;
            margin-top: 1.5em;
            font-weight: 600;
        }
        
        .decoration {
            margin: 2em 0;
            color: #6b7280;
            font-size: 1.1em;
        }
    </style>
</head>
<body class="bg-white text-black" dir="rtl">

    <!-- زر الطباعة -->
    <div class="no-print" style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
        <button onclick="window.print()" style="background: #059669; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
            🖨️ طباعة الغلاف
        </button>
    </div>

    <div class="cover-page">
        <div class="cover-container">
            <h1 class="main-title">الرنين في الأعمدة الهوائية والأوتار</h1>
            
            <div class="subject">مادة الفيزياء</div>
            
            <div class="decoration">⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯</div>
            
            <div class="student-info">
                <div class="info-item">
                    <strong>عمل الطالب:</strong><br>
                    سلطان مروان
                </div>
            </div>
            
            <div class="class-info">
                <strong>الشعبة:</strong> 304
            </div>
            
            <div class="decoration">⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯⎯</div>
            
            <div class="year">العام الدراسي 2024 / 2025</div>
        </div>
    </div>

    <script>
        // تحسين الطباعة
        window.addEventListener('beforeprint', function() {
            document.body.style.fontSize = '14pt';
        });
    </script>
</body>
</html>
