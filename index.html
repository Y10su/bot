<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر ملفات PDF</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #166088;
            --accent-color: #4fc3a1;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --success-color: #2ecc71;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        header h1 {
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        
        header p {
            text-align: center;
            opacity: 0.9;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 20px;
        }
        
        .tools-panel {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        
        .tools-panel h2 {
            color: var(--primary-color);
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .tool-group {
            margin-bottom: 25px;
        }
        
        .tool-group h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }
        
        .btn {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        
        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background-color: var(--danger-color);
        }
        
        .btn-danger:hover {
            background-color: #c0392b;
        }
        
        .btn-success {
            background-color: var(--success-color);
        }
        
        .btn-success:hover {
            background-color: #27ae60;
        }
        
        .btn-warning {
            background-color: var(--warning-color);
        }
        
        .btn-warning:hover {
            background-color: #e67e22;
        }
        
        .btn-accent {
            background-color: var(--accent-color);
        }
        
        .btn-accent:hover {
            background-color: #3da58a;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label {
            display: block;
            padding: 12px 15px;
            background-color: var(--light-color);
            border: 2px dashed #ccc;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .file-label:hover {
            border-color: var(--primary-color);
            background-color: #e9ecef;
        }
        
        .preview-area {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .preview-header h2 {
            color: var(--primary-color);
        }
        
        .preview-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .preview-placeholder {
            text-align: center;
            color: #6c757d;
        }
        
        .preview-placeholder i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #dee2e6;
        }
        
        .page-thumbnails {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .page-thumbnail {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            text-align: center;
            background-color: #f8f9fa;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .page-thumbnail:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .page-thumbnail.selected {
            border-color: var(--accent-color);
            background-color: #e8f5f1;
        }
        
        .page-number {
            margin-top: 10px;
            font-weight: bold;
            color: var(--secondary-color);
        }
        
        .page-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .page-controls button {
            flex: 1;
            padding: 5px;
            font-size: 0.8rem;
        }
        
        .status-bar {
            background-color: var(--light-color);
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            position: relative;
            overflow: hidden;
        }
        
        .loading::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
            animation: loading 1.5s infinite;
        }
        
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @media (max-width: 768px) {
            .app-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>محرر ملفات PDF</h1>
            <p>قم بتحرير ومعالجة ملفات PDF بسهولة عبر المتصفح</p>
        </header>
        
        <div class="app-container">
            <div class="tools-panel">
                <h2>أدوات التحكم</h2>
                
                <div class="tool-group">
                    <h3>تحميل الملفات</h3>
                    <input type="file" id="pdfFile" class="file-input" accept=".pdf">
                    <label for="pdfFile" class="file-label">تحميل ملف PDF</label>
                    
                    <input type="file" id="imageFiles" class="file-input" accept="image/*" multiple>
                    <label for="imageFiles" class="file-label">تحميل صور لتحويلها إلى PDF</label>
                </div>
                
                <div class="tool-group">
                    <h3>معالجة الصفحات</h3>
                    <button class="btn btn-danger" id="deletePages">حذف الصفحات المحددة</button>
                    <button class="btn" id="extractPages">استخراج الصفحات المحددة</button>
                    <button class="btn" id="reorderPages">إعادة ترتيب الصفحات</button>
                    <button class="btn" id="rotatePages">تدوير الصفحات</button>
                </div>
                
                <div class="tool-group">
                    <h3>دمج وتقسيم</h3>
                    <button class="btn btn-accent" id="mergePDFs">دمج ملفات PDF</button>
                    <button class="btn" id="splitPDF">تقسيم PDF</button>
                </div>
                
                <div class="tool-group">
                    <h3>تحويل</h3>
                    <button class="btn btn-success" id="imagesToPDF">تحويل الصور إلى PDF</button>
                    <button class="btn" id="pdfToImages">تحويل PDF إلى صور</button>
                </div>
                
                <div class="tool-group">
                    <h3>حفظ وتحميل</h3>
                    <button class="btn btn-warning" id="downloadPDF">تحميل PDF</button>
                    <button class="btn" id="resetAll">إعادة تعيين الكل</button>
                </div>
            </div>
            
            <div class="preview-area">
                <div class="preview-header">
                    <h2>معاينة الملف</h2>
                    <div id="fileInfo">لا يوجد ملف محمل</div>
                </div>
                
                <div class="preview-content">
                    <div class="preview-placeholder" id="previewPlaceholder">
                        <i>📄</i>
                        <h3>لم يتم تحميل أي ملف بعد</h3>
                        <p>قم بتحميل ملف PDF أو صور لبدء التحرير</p>
                    </div>
                    
                    <div id="pdfViewer" class="hidden">
                        <div class="page-thumbnails" id="pageThumbnails">
                            <!-- سيتم إضافة معاينات الصفحات هنا -->
                        </div>
                    </div>
                    
                    <div id="imagePreview" class="hidden">
                        <div class="page-thumbnails" id="imageThumbnails">
                            <!-- سيتم إضافة معاينات الصور هنا -->
                        </div>
                    </div>
                </div>
                
                <div class="status-bar" id="statusBar">
                    جاهز للاستخدام
                </div>
            </div>
        </div>
    </div>

    <script>
        // متغيرات التطبيق
        let currentPDF = null;
        let selectedPages = new Set();
        let uploadedImages = [];
        
        // عناصر DOM
        const pdfFileInput = document.getElementById('pdfFile');
        const imageFilesInput = document.getElementById('imageFiles');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const pdfViewer = document.getElementById('pdfViewer');
        const imagePreview = document.getElementById('imagePreview');
        const pageThumbnails = document.getElementById('pageThumbnails');
        const imageThumbnails = document.getElementById('imageThumbnails');
        const fileInfo = document.getElementById('fileInfo');
        const statusBar = document.getElementById('statusBar');
        
        // أزرار التحكم
        const deletePagesBtn = document.getElementById('deletePages');
        const extractPagesBtn = document.getElementById('extractPages');
        const reorderPagesBtn = document.getElementById('reorderPages');
        const rotatePagesBtn = document.getElementById('rotatePages');
        const mergePDFsBtn = document.getElementById('mergePDFs');
        const splitPDFBtn = document.getElementById('splitPDF');
        const imagesToPDFBtn = document.getElementById('imagesToPDF');
        const pdfToImagesBtn = document.getElementById('pdfToImages');
        const downloadPDFBtn = document.getElementById('downloadPDF');
        const resetAllBtn = document.getElementById('resetAll');
        
        // معالجة تحميل ملف PDF
        pdfFileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file && file.type === 'application/pdf') {
                loadPDF(file);
            } else {
                updateStatus('الرجاء اختيار ملف PDF صالح', 'error');
            }
        });
        
        // معالجة تحميل الصور
        imageFilesInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const imageFiles = files.filter(file => file.type.startsWith('image/'));
            
            if (imageFiles.length > 0) {
                loadImages(imageFiles);
            } else {
                updateStatus('الرجاء اختيار ملفات صور صالحة', 'error');
            }
        });
        
        // دالة تحميل PDF
        function loadPDF(file) {
            updateStatus('جاري تحميل ملف PDF...', 'loading');
            
            // محاكاة لتحميل PDF (في تطبيق حقيقي، سنستخدم pdf.js أو مكتبة مشابهة)
            setTimeout(() => {
                currentPDF = {
                    name: file.name,
                    size: (file.size / (1024 * 1024)).toFixed(2) + ' MB',
                    pages: 5 // محاكاة لعدد الصفحات
                };
                
                displayPDFInfo();
                renderPageThumbnails();
                updateStatus('تم تحميل ملف PDF بنجاح', 'success');
            }, 1500);
        }
        
        // دالة تحميل الصور
        function loadImages(files) {
            updateStatus('جاري تحميل الصور...', 'loading');
            
            uploadedImages = [];
            
            // محاكاة لتحميل الصور
            files.forEach((file, index) => {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    uploadedImages.push({
                        id: index,
                        name: file.name,
                        url: e.target.result,
                        size: (file.size / 1024).toFixed(2) + ' KB'
                    });
                    
                    if (uploadedImages.length === files.length) {
                        displayImageThumbnails();
                        updateStatus(`تم تحميل ${files.length} صورة`, 'success');
                    }
                };
                
                reader.readAsDataURL(file);
            });
        }
        
        // عرض معلومات PDF
        function displayPDFInfo() {
            previewPlaceholder.classList.add('hidden');
            pdfViewer.classList.remove('hidden');
            imagePreview.classList.add('hidden');
            
            fileInfo.textContent = `${currentPDF.name} - ${currentPDF.size} - ${currentPDF.pages} صفحة`;
        }
        
        // عرض معاينات صفحات PDF
        function renderPageThumbnails() {
            pageThumbnails.innerHTML = '';
            
            for (let i = 1; i <= currentPDF.pages; i++) {
                const pageThumbnail = document.createElement('div');
                pageThumbnail.className = 'page-thumbnail';
                pageThumbnail.dataset.page = i;
                
                pageThumbnail.innerHTML = `
                    <div style="width: 100px; height: 140px; background: #f0f0f0; margin: 0 auto; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd;">
                        <span>الصفحة ${i}</span>
                    </div>
                    <div class="page-number">الصفحة ${i}</div>
                    <div class="page-controls">
                        <button class="btn" onclick="togglePageSelection(${i})">تحديد</button>
                    </div>
                `;
                
                pageThumbnails.appendChild(pageThumbnail);
            }
        }
        
        // عرض معاينات الصور
        function displayImageThumbnails() {
            previewPlaceholder.classList.add('hidden');
            pdfViewer.classList.add('hidden');
            imagePreview.classList.remove('hidden');
            
            imageThumbnails.innerHTML = '';
            
            uploadedImages.forEach(image => {
                const imageThumbnail = document.createElement('div');
                imageThumbnail.className = 'page-thumbnail';
                
                imageThumbnail.innerHTML = `
                    <img src="${image.url}" alt="${image.name}" style="max-width: 100px; max-height: 140px; margin: 0 auto; display: block;">
                    <div class="page-number">${image.name}</div>
                    <div class="page-controls">
                        <button class="btn btn-danger" onclick="removeImage(${image.id})">حذف</button>
                    </div>
                `;
                
                imageThumbnails.appendChild(imageThumbnail);
            });
            
            fileInfo.textContent = `${uploadedImages.length} صورة محملة`;
        }
        
        // تبديل تحديد الصفحة
        function togglePageSelection(pageNum) {
            const pageElement = document.querySelector(`.page-thumbnail[data-page="${pageNum}"]`);
            
            if (selectedPages.has(pageNum)) {
                selectedPages.delete(pageNum);
                pageElement.classList.remove('selected');
            } else {
                selectedPages.add(pageNum);
                pageElement.classList.add('selected');
            }
            
            updateStatus(`الصفحات المحددة: ${Array.from(selectedPages).join(', ')}`);
        }
        
        // حذف صورة
        function removeImage(imageId) {
            uploadedImages = uploadedImages.filter(img => img.id !== imageId);
            displayImageThumbnails();
        }
        
        // تحديث شريط الحالة
        function updateStatus(message, type = 'info') {
            statusBar.textContent = message;
            
            // إزالة أي classes سابقة
            statusBar.classList.remove('loading', 'success', 'error');
            
            if (type === 'loading') {
                statusBar.classList.add('loading');
            } else if (type === 'success') {
                statusBar.style.color = 'var(--success-color)';
            } else if (type === 'error') {
                statusBar.style.color = 'var(--danger-color)';
            } else {
                statusBar.style.color = '#6c757d';
            }
        }
        
        // معالجة أزرار التحكم
        deletePagesBtn.addEventListener('click', function() {
            if (selectedPages.size === 0) {
                updateStatus('الرجاء تحديد صفحات للحذف', 'error');
                return;
            }
            
            updateStatus(`جاري حذف الصفحات: ${Array.from(selectedPages).join(', ')}`, 'loading');
            
            // محاكاة لحذف الصفحات
            setTimeout(() => {
                currentPDF.pages -= selectedPages.size;
                selectedPages.clear();
                renderPageThumbnails();
                updateStatus('تم حذف الصفحات المحددة', 'success');
            }, 1500);
        });
        
        imagesToPDFBtn.addEventListener('click', function() {
            if (uploadedImages.length === 0) {
                updateStatus('لا توجد صور محملة للتحويل', 'error');
                return;
            }
            
            updateStatus('جاري تحويل الصور إلى PDF...', 'loading');
            
            // محاكاة للتحويل
            setTimeout(() => {
                currentPDF = {
                    name: 'ملف_من_الصور.pdf',
                    size: '1.2 MB',
                    pages: uploadedImages.length
                };
                
                displayPDFInfo();
                renderPageThumbnails();
                uploadedImages = [];
                updateStatus('تم تحويل الصور إلى PDF بنجاح', 'success');
            }, 2000);
        });
        
        downloadPDFBtn.addEventListener('click', function() {
            if (!currentPDF) {
                updateStatus('لا يوجد ملف PDF للتحميل', 'error');
                return;
            }
            
            updateStatus('جاري تحضير ملف PDF للتحميل...', 'loading');
            
            // محاكاة للتحميل
            setTimeout(() => {
                updateStatus('تم تحميل ملف PDF بنجاح', 'success');
                
                // في تطبيق حقيقي، سنقوم بإنشاء رابط تحميل
                alert('سيبدأ تحميل ملف PDF في تطبيق حقيقي');
            }, 1500);
        });
        
        resetAllBtn.addEventListener('click', function() {
            currentPDF = null;
            selectedPages.clear();
            uploadedImages = [];
            
            previewPlaceholder.classList.remove('hidden');
            pdfViewer.classList.add('hidden');
            imagePreview.classList.add('hidden');
            
            fileInfo.textContent = 'لا يوجد ملف محمل';
            updateStatus('تم إعادة تعيين الكل', 'success');
            
            // إعادة تعيين مدخلات الملفات
            pdfFileInput.value = '';
            imageFilesInput.value = '';
        });
        
        // إضافة معالجات للأزرار الأخرى (للتوضيح فقط)
        const otherButtons = [
            extractPagesBtn, reorderPagesBtn, rotatePagesBtn, 
            mergePDFsBtn, splitPDFBtn, pdfToImagesBtn
        ];
        
        otherButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                updateStatus(`هذه الميزة ستكون متاحة في النسخة الكاملة من التطبيق`, 'info');
            });
        });
    </script>
</body>
</html>
