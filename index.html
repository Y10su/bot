<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مصور الأكواد الذكي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --bg: #F3F4F6;
            --panel: #FFFFFF;
            --border: #E5E7EB;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; color: #333; }
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; overflow: visible;}
        }
        .sidebar, .preview-section {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
        }
        .sidebar { flex: 1; max-width: 400px; overflow-y: auto;}
        .preview-section { flex: 2; overflow: hidden; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #4B5563;}
        textarea, select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        /* جعل مربع الكود من اليسار لليمين */
        textarea { height: 180px; resize: vertical; direction: ltr; font-family: monospace; background: #f8fafc;}
        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #9CA3AF; cursor: not-allowed; transform: none;}

        .preview-container {
            flex: 1;
            overflow: auto;
            background: #e5e5f7;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
        }
        
        /* منطقة الريندر التي سيتم تصويرها */
        #render-area {
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: width 0.3s, height 0.3s;
        }

        /* المقاسات */
        .ratio-16-9 { width: 1280px; height: 720px; }
        .ratio-a4-p { width: 794px; height: 1123px; }
        .ratio-a4-l { width: 1123px; height: 794px; }
        .ratio-auto { width: 100%; min-height: 400px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>📸 محول HTML إلى صورة</h2>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="form-group">
                <label>كود HTML / CSS :</label>
                <textarea id="html-input" placeholder="اكتب كودك هنا..."></textarea>
            </div>
            
            <div class="form-group">
                <button onclick="updatePreview()" style="width: 100%; background: #10B981;">تحديث المعاينة 🔄</button>
            </div>

            <div class="form-group">
                <label>المقاس (الأبعاد):</label>
                <select id="size-select" onchange="changeSize()">
                    <option value="ratio-16-9">شاشة 16:9 (1280x720)</option>
                    <option value="ratio-a4-p">ورقة A4 (طولية)</option>
                    <option value="ratio-a4-l">ورقة A4 (عرضية)</option>
                    <option value="ratio-auto">تلقائي (حسب المحتوى)</option>
                </select>
            </div>

            <div class="form-group">
                <label>وقت الانتظار قبل التصوير (بالثواني):</label>
                <input type="number" id="delay-input" value="2" min="0" max="15">
                <small style="color: #6B7280; display: block; margin-top: 5px;">
                    * مفيد لضمان تحميل الصور والخطوط الخارجية قبل الالتقاط.
                </small>
            </div>

            <button id="capture-btn" onclick="captureImage()">التقاط وتحميل الصورة 📥</button>
        </div>

        <div class="preview-section">
            <label>المعاينة المباشرة:</label>
            <div class="preview-container">
                <div id="render-area" class="ratio-16-9">
                    </div>
            </div>
        </div>
    </div>

    <script>
        // تحديث المعاينة فوراً
        function updatePreview() {
            const code = document.getElementById('html-input').value;
            document.getElementById('render-area').innerHTML = code;
        }

        // تغيير مقاس الإطار
        function changeSize() {
            const sizeClass = document.getElementById('size-select').value;
            const renderArea = document.getElementById('render-area');
            renderArea.className = sizeClass;
        }

        // وظيفة التقاط الصورة
        async function captureImage() {
            const btn = document.getElementById('capture-btn');
            const delay = document.getElementById('delay-input').value * 1000;
            const renderArea = document.getElementById('render-area');

            // نحدث المعاينة للتأكد من أحدث التغييرات
            updatePreview();

            // تعطيل الزر لمنع التكرار
            btn.disabled = true;
            
            if (delay > 0) {
                btn.innerText = `⏳ ننتظر ${delay/1000} ثانية للتحميل...`;
            }

            // بدء مؤقت الانتظار
            setTimeout(async () => {
                btn.innerText = "📸 جاري التقاط الصورة...";
                try {
                    // إعدادات التصوير
                    const canvas = await html2canvas(renderArea, {
                        scale: 2, // جودة عالية (Retina)
                        useCORS: true, // مهم جداً لدعم الصور الخارجية
                        backgroundColor: '#ffffff' 
                    });

                    // إنشاء رابط لتحميل الصورة
                    const link = document.createElement('a');
                    link.download = 'code-screenshot.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                } catch (error) {
                    alert("حدث خطأ أثناء التقاط الصورة. تأكد من أن الصور الخارجية تدعم CORS.");
                    console.error(error);
                } finally {
                    // إعادة الزر لحالته الطبيعية
                    btn.disabled = false;
                    btn.innerText = "التقاط وتحميل الصورة 📥";
                }
            }, delay);
        }

        // كود تجريبي يظهر عند فتح الصفحة لأول مرة
        const defaultCode = `
<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; font-family:sans-serif;">
    <h1 style="font-size: 4rem; margin:0;">أهلاً بك! ✨</h1>
    <p style="font-size: 1.5rem; opacity: 0.9;">قم بكتابة كود HTML هنا لتصويره</p>
</div>`;
        document.getElementById('html-input').value = defaultCode.trim();
        updatePreview();
    </script>
</body>
</html>
