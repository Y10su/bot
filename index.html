        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 15px; color: var(--text-light); }
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;

        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; overflow: visible;}
        }
        .sidebar, .preview-section {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);

        .sidebar { flex: 1; max-width: 400px; overflow-y: auto;}
        .preview-section { flex: 2; overflow: hidden; padding: 0; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #E6D5B8;}
        textarea, select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #1A120B;
            color: #E6D5B8;
            transition: border 0.3s;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--text-light);
        }
        
        textarea { flex: 1; min-height: 250px; resize: vertical; direction: ltr; font-family: monospace;}
        
        button {
            background: var(--primary);
            color: white;
            border: 2px solid var(--border);
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: auto;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button:disabled { background: #5C4033; cursor: not-allowed; transform: none; border-color: #5C4033;}

        /* إطار المعاينة المعزول بالكامل */
        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1A120B;
            border-radius: 12px;
        }
        .preview-header {
            padding: 10px 20px;
            background: var(--primary-hover);
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;

    </div>

        // دالة التحديث للمعاينة باستخدام Iframe
        function updatePreview() {
            const code = document.getElementById('html-input').value;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;
        }

        // دالة استخراج الـ PDF
        function exportToPDF() {
            const btn = document.getElementById('capture-btn');
            const delay = document.getElementById('delay-input').value * 1000;
            const fileName = document.getElementById('file-name').value || 'presentation';
            const qualityScale = parseInt(document.getElementById('quality-select').value);
            
            // نأخذ الكود من داخل إطار المعاينة لضمان استخراج ما يظهر للمستخدم بالضبط
            const iframe = document.getElementById('preview-frame');
            const element = iframe.contentDocument.body; 

            // تغيير الزر لانتظار التحميل
            btn.disabled = true;
            if (delay > 0) {
                btn.innerText = `⏳ ننتظر ${delay/1000} ثانية لتحميل الصور...`;
            }

            // إعداد الـ PDF بالأبعاد الدقيقة التي طلبتها: عرض 1000 وارتفاع 562.5 بكسل
            setTimeout(() => {
                btn.innerText = "📄 جاري إنشاء ملف PDF...";
                
                const opt = {
                    margin:       0, // بدون هوامش ليقص الحدود تماماً
                    filename:     `${fileName}.pdf`,
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { scale: qualityScale, useCORS: true, windowWidth: 1000 },
                    // تعيين أبعاد ثابتة للـ PDF تتطابق مع مقاس .page لديك
                    jsPDF:        { unit: 'px', format: [1000, 562.5], orientation: 'landscape' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    btn.disabled = false;
                    btn.innerText = "استخراج كملف PDF 📥";
                }).catch(err => {
                    alert("حدث خطأ! تأكد من اتصالك بالإنترنت لدعم الصور الخارجية.");
                    console.error(err);
                    btn.disabled = false;
                    btn.innerText = "استخراج كملف PDF 📥";
                });
            }, delay);
        }

        // إدراج كود المشروع عند فتح الصفحة لأول مرة
        window.onload = () => {
            document.getElementById('html-input').value = defaultCode.trim();
            updatePreview();
        };
    </script>
