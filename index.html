<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الحب والكره</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #d63384;
            margin-bottom: 10px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        
        .section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            color: #d63384;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffb6c1;
        }
        
        .love-title {
            color: #d63384;
        }
        
        .hate-title {
            color: #6c757d;
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .btn {
            border: none;
            border-radius: 15px;
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        
        .btn:active {
            transform: translateY(2px);
        }
        
        .love-btn {
            background: linear-gradient(145deg, #ff6b6b, #ff8e8e);
        }
        
        .love-btn:hover {
            background: linear-gradient(145deg, #ff5252, #ff7979);
        }
        
        .hate-btn {
            background: linear-gradient(145deg, #6c757d, #868e96);
        }
        
        .hate-btn:hover {
            background: linear-gradient(145deg, #5a6268, #727b84);
        }
        
        .message-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .message {
            font-size: 2rem;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
            text-align: center;
        }
        
        .message.show {
            opacity: 1;
        }
        
        .love-message {
            color: #d63384;
        }
        
        .hate-message {
            color: #6c757d;
        }
        
        .heart {
            color: #ff6b6b;
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        .broken-heart {
            color: #6c757d;
            display: inline-block;
            animation: shake 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        @keyframes shake {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(10deg); }
            50% { transform: rotate(0deg); }
            75% { transform: rotate(-10deg); }
            100% { transform: rotate(0deg); }
        }
        
        footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .message {
                font-size: 1.5rem;
            }
            
            .buttons-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>موقع الحب والكره <span class="heart">❤</span></h1>
        <p class="subtitle">اختر مشاعرك تجاه كل شخص</p>
        
        <div class="section">
            <h2 class="section-title love-title">أزرار الحب</h2>
            <div class="buttons-container">
                <button class="btn love-btn" data-name="سلطان" data-type="love">
                    <span class="heart">❤</span> أحب سلطان
                </button>
                <button class="btn love-btn" data-name="ريتاج" data-type="love">
                    <span class="heart">❤</span> أحب ريتاج
                </button>
                <button class="btn love-btn" data-name="ريما" data-type="love">
                    <span class="heart">❤</span> أحب ريما
                </button>
            </div>
        </div>
        
        <div class="section">
            <h2 class="section-title hate-title">أزرار الكره</h2>
            <div class="buttons-container">
                <button class="btn hate-btn" data-name="سلطان" data-type="hate">
                    <span class="broken-heart">💔</span> أكره سلطان
                </button>
                <button class="btn hate-btn" data-name="ريتاج" data-type="hate">
                    <span class="broken-heart">💔</span> أكره ريتاج
                </button>
                <button class="btn hate-btn" data-name="ريما" data-type="hate">
                    <span class="broken-heart">💔</span> أكره ريما
                </button>
            </div>
        </div>
        
        <div class="message-container">
            <div class="message" id="message"></div>
        </div>
    </div>
    
    <footer>صمم خصيصًا للتعبير عن المشاعر ❤</footer>

    <script>
        // الحصول على جميع الأزرار وعنصر الرسالة
        const buttons = document.querySelectorAll('.btn');
        const message = document.getElementById('message');
        
        // إضافة حدث النقر لكل زر
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const name = button.getAttribute('data-name');
                const type = button.getAttribute('data-type');
                
                // إخفاء الرسالة أولاً ثم إظهارها بعد فترة بسيطة للتحريك
                message.classList.remove('show');
                
                setTimeout(() => {
                    if (type === 'love') {
                        message.textContent = `أحبك ${name}`;
                        message.className = 'message love-message show';
                    } else {
                        message.textContent = `أكرهك ${name}`;
                        message.className = 'message hate-message show';
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
