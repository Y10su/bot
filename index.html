<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول HTML إلى PDF 📄</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #8B2626; 
            --primary-hover: #5C4033;
            --bg: #1A120B;
            --panel: #2C1E16;
            --text-light: #F4EBD0;
            --border: #A68A61;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 15px; color: var(--text-light); }
        .main-container {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }
        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; overflow: visible;}
        }
        .sidebar, .preview-section {
            background: var(--panel);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
        }
        .sidebar { flex: 1; max-width: 400px; overflow-y: auto;}
        .preview-section { flex: 2; overflow: hidden; padding: 0; position: relative;}

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #E6D5B8;}
        textarea, select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background: #1A120B;
            color: #E6D5B8;
            transition: border 0.3s;
        }
        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--text-light);
        }
        
        textarea { flex: 1; min-height: 250px; resize: vertical; direction: ltr; font-family: monospace;}
        
        button {
            background: var(--primary);
            color: white;
            border: 2px solid var(--border);
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s;
            margin-top: auto;
        }
        button:hover { background: var(--primary-hover); transform: translateY(-2px); }
        button:disabled { background: #5C4033; cursor: not-allowed; transform: none; border-color: #5C4033;}

        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1A120B;
            border-radius: 0 0 12px 12px;
        }
        .preview-header {
            padding: 10px 20px;
            background: var(--primary-hover);
            border-bottom: 1px solid var(--border);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-radius: 12px 12px 0 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>📄 محول العروض والمشاريع إلى PDF</h2>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="form-group">
                <label>اسم الملف:</label>
                <input type="text" id="file-name" value="القضية_الفلسطينية" placeholder="بدون صيغة، مثلا: design">
            </div>

            <div class="form-group" style="display: flex; flex-direction: column; flex: 1;">
                <label>كود HTML / CSS (تحديث تلقائي):</label>
                <textarea id="html-input" oninput="updatePreview()" placeholder="اكتب كودك هنا..."></textarea>
            </div>

            <div class="form-group">
                <label>جودة الاستخراج:</label>
                <select id="quality-select">
                    <option value="1">عادية (أسرع، لحجم أصغر)</option>
                    <option value="2" selected>عالية (موصى بها)</option>
                    <option value="3">ممتازة (للشاشات الكبيرة)</option>
                    <option value="4">فائقة (للطباعة الاحترافية)</option>
                </select>
            </div>

            <div class="form-group">
                <label>الانتظار قبل التحويل (بالثواني):</label>
                <input type="number" id="delay-input" value="3" min="0" max="10">
            </div>

            <button id="capture-btn" onclick="exportToPDF()">استخراج كملف PDF 📥</button>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span>المعاينة المباشرة المعزولة</span>
                <span style="font-size: 12px; font-weight: normal; opacity: 0.8;">الحدود مثبتة على 1000 × 562.5</span>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const defaultCode = `<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1050">
<title>القضية الفلسطينية - تاريخ وهوية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --paper-bg: #F4EBD0;
  --paper-dark: #E6D5B8;
  --ink-dark: #2C1E16;
  --ink-light: #5C4033;
  --vintage-red: #8B2626;
  --vintage-green: #2E4C38;
  --vintage-gold: #B8860B;
  --border-color: #A68A61;
}

html, body {
  font-family: 'Amiri', serif;
  background: #1A120B;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 20px 0;
}

.btn-print { display: none; }

.page {
  width: 1000px;
  height: 562.5px;
  background-color: var(--paper-bg);
  background-image: 
    radial-gradient(circle at center, transparent 0%, rgba(139, 69, 19, 0.05) 100%),
    linear-gradient(rgba(166, 138, 97, 0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(166, 138, 97, 0.1) 1px, transparent 1px);
  background-size: 100% 100%, 20px 20px, 20px 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  position: relative;
  overflow: hidden;
  page-break-after: always;
  flex-shrink: 0;
  color: var(--ink-dark);
  margin: 0 auto;
}

.pg-inner {
  position: absolute;
  top: 20px; bottom: 20px; right: 20px; left: 20px;
  border: 3px double var(--border-color);
  padding: 20px 30px;
  display: flex;
  flex-direction: column;
}

.corner { position: absolute; width: 15px; height: 15px; border: 3px solid var(--vintage-gold); }
.c-tl { top: 12px; left: 12px; border-bottom: none; border-right: none; }
.c-tr { top: 12px; right: 12px; border-bottom: none; border-left: none; }
.c-bl { bottom: 12px; left: 12px; border-top: none; border-right: none; }
.c-br { bottom: 12px; right: 12px; border-top: none; border-left: none; }

.pg-cover { justify-content: center; align-items: center; text-align: center; }
.cover-img { width: 150px; height: 150px; border-radius: 50%; border: 4px solid var(--border-color); margin-bottom: 15px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.2); background-color: var(--paper-dark); }
.cover-title { font-family: 'Aref Ruqaa', serif; font-size: 46px; color: var(--vintage-red); margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); line-height: 1.2; }
.cover-subtitle { font-family: 'Aref Ruqaa', serif; font-size: 26px; color: var(--ink-light); margin-bottom: 20px; }
.cover-sep { width: 100px; height: 2px; background: var(--vintage-gold); margin: 0 auto 15px; }
.cover-meta { font-family: 'Cairo', sans-serif; font-size: 16px; color: var(--ink-dark); line-height: 1.8; }

.ph { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--border-color); padding-bottom: 5px; margin-bottom: 15px; flex-shrink: 0; }
.ph-title { font-family: 'Aref Ruqaa', serif; font-size: 28px; color: var(--vintage-red); line-height: 1; }
.ph-tag { font-family: 'Cairo', sans-serif; font-size: 13px; background: var(--vintage-gold); color: #fff; padding: 4px 12px; border-radius: 4px; }

.txt-col-2 { column-count: 2; column-gap: 20px; text-align: justify; font-size: 16px; line-height: 1.7; }
.txt-box { background: rgba(230, 213, 184, 0.5); border-right: 4px solid var(--vintage-red); padding: 12px 18px; margin-bottom: 15px; font-size: 16px; line-height: 1.7; text-align: justify; }

.grid-timeline { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; }
.timeline-card { border: 1px solid var(--border-color); background: var(--paper-bg); padding: 12px; display: flex; flex-direction: column; }
.t-img { width: 100%; height: 140px; object-fit: cover; border-bottom: 2px solid var(--vintage-gold); margin-bottom: 10px; filter: sepia(0.4) contrast(1.1); background-color: var(--paper-dark); }
.t-year { font-family: 'Aref Ruqaa', serif; font-size: 22px; color: var(--vintage-red); margin-bottom: 6px; }
.t-desc { font-size: 15px; line-height: 1.6; text-align: justify; }

.grid-symbols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 15px; }
.symbol-card { text-align: center; }
.s-img { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--vintage-green); margin: 0 auto 10px; object-fit: cover; filter: sepia(0.3); display: block; background-color: var(--paper-dark); }
.s-title { font-family: 'Aref Ruqaa', serif; font-size: 20px; color: var(--ink-dark); margin-bottom: 5px; }
.s-desc { font-size: 14px; line-height: 1.6; color: var(--ink-light); }

.img-standard { width: 100%; height: 260px; object-fit: cover; border: 3px double var(--border-color); filter: sepia(0.3); background-color: var(--paper-dark); }

.pfooter { position: absolute; bottom: 15px; left: 30px; right: 30px; display: flex; justify-content: space-between; font-family: 'Cairo', sans-serif; font-size: 13px; color: var(--ink-light); border-top: 1px solid var(--border-color); padding-top: 6px; }
.pnum { font-weight: bold; color: var(--vintage-red); }

@media print {
  @page { size: landscape; margin: 0; }
  html, body { background: none; padding: 0; margin: 0; }
  .page { box-shadow: none; margin: 0 auto; border: none; }
}
</style>
</head>
<body>

<div class="page">
  <div class="c-tl corner"></div><div class="c-tr corner"></div>
  <div class="c-bl corner"></div><div class="c-br corner"></div>
  <div class="pg-inner pg-cover">
    <img src="https://upload.wikimedia.org/wikipedia/commons/6/66/Jerusalem-2013-Temple_Mount-Dome_of_the_Rock_%26_Chain_02.jpg" alt="المسجد الأقصى" class="cover-img">
    <div class="cover-title">القَضِيَّةُ الفِلَسْطِينِيَّة</div>
    <div class="cover-subtitle">تاريخٌ يُكتب.. وهويةٌ لا تُمحى</div>
    <div class="cover-sep"></div>
    <div class="cover-meta">
      <strong>إعداد:</strong> [اسم الطالب/ة]<br>
      <strong>المادة:</strong> الدراسات الاجتماعية / التاريخ<br>
      <strong>الصف:</strong> الأول الثانوي<br>
      <strong>العام الدراسي:</strong> ١٤٤٦ هـ
    </div>
  </div>
</div>

<div class="page">
  <div class="pg-inner">
    <div class="ph">
      <div class="ph-title">المقدمة والأهمية</div>
      <div class="ph-tag">المدخل التاريخي</div>
    </div>
    
    <div class="txt-box">
      تُعد القضية الفلسطينية من أهم القضايا المحورية في التاريخ الحديث العَربي والإسلامي، بل والإنساني. إنها ليست مجرد صراع على بقعة جغرافية، بل هي حكاية شعب متجذر في أرضه منذ آلاف السنين، يسعى للحرية والاستقلال والحفاظ على مقدساته وهويته الوطنية أمام محاولات الطمس والتهويد.
    </div>

    <div class="txt-col-2">
      <p><strong>أهمية دراسة القضية:</strong><br>
      إن فهم الجذور التاريخية لفلسطين، ومحطات الصراع المتتالية، يُعزز من الوعي والانتماء لدى الأجيال الناشئة. كما يوضح حجم التضحيات التي قُدمت، ويبرز أهمية القدس والمسجد الأقصى مكانياً ودينياً وتاريخياً بالنسبة للمسلمين والعرب.</p>
      
      <p><strong>أهداف هذا البحث:</strong><br>
      ١. تسليط الضوء على أبرز المحطات التاريخية الفاصلة.<br>
      ٢. التعرف على الرموز الثقافية المعبرة عن هوية الشعب.<br>
      ٣. إدراك المكانة الجغرافية والدينية لأرض فلسطين.<br>
      ٤. ترسيخ مبدأ الحق والعدالة في الوجدان.</p>
    </div>
  </div>
  <div class="pfooter"><span>القضية الفلسطينية - الصف الأول الثانوي</span><span class="pnum">٢</span></div>
</div>

</body>
</html>`;

        function updatePreview() {
            const code = document.getElementById('html-input').value;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;
        }

        function exportToPDF() {
            const btn = document.getElementById('capture-btn');
            const delay = document.getElementById('delay-input').value * 1000;
            const fileName = document.getElementById('file-name').value || 'presentation';
            const qualityScale = parseInt(document.getElementById('quality-select').value);
            
            const iframe = document.getElementById('preview-frame');
            
            // 🔥 [الحل الجذري لمشكلة الجوال] 🔥
            // حفظ الخصائص الأصلية للإطار
            const origWidth = iframe.style.width;
            const origHeight = iframe.style.height;
            const origPosition = iframe.style.position;
            const origZIndex = iframe.style.zIndex;

            // نخدع المتصفح ونجعل الإطار بعرض 1000 بكسل فعلياً لثوانٍ معدودة حتى لا تنقص الصورة
            iframe.style.position = 'absolute';
            iframe.style.width = '1000px';
            // جعل الارتفاع تلقائي ليشمل كل الصفحات
            iframe.style.height = iframe.contentDocument.documentElement.scrollHeight + 'px';
            iframe.style.zIndex = '-1'; 

            const element = iframe.contentDocument.body; 

            btn.disabled = true;
            if (delay > 0) {
                btn.innerText = `⏳ ننتظر ${delay/1000} ثانية لتحميل الصور...`;
            }

            setTimeout(() => {
                btn.innerText = "📄 جاري إنشاء ملف PDF...";
                
                const opt = {
                    margin:       0,
                    filename:     `${fileName}.pdf`,
                    image:        { type: 'jpeg', quality: 1 },
                    html2canvas:  { 
                        scale: qualityScale, 
                        useCORS: true, 
                        // 🔥 أوامر إجبارية لمنع القص في الجوال 🔥
                        windowWidth: 1000, 
                        width: 1000, 
                        scrollX: 0, 
                        scrollY: 0 
                    },
                    jsPDF:        { unit: 'px', format: [1000, 562.5], orientation: 'landscape' }
                };

                html2pdf().set(opt).from(element).save().then(() => {
                    // إرجاع الإطار لحجمه الطبيعي
                    iframe.style.width = origWidth;
                    iframe.style.height = origHeight;
                    iframe.style.position = origPosition;
                    iframe.style.zIndex = origZIndex;

                    btn.disabled = false;
                    btn.innerText = "استخراج كملف PDF 📥";
                }).catch(err => {
                    iframe.style.width = origWidth;
                    iframe.style.height = origHeight;
                    iframe.style.position = origPosition;
                    iframe.style.zIndex = origZIndex;

                    alert("حدث خطأ! تأكد من اتصالك بالإنترنت لدعم الصور الخارجية.");
                    console.error(err);
                    btn.disabled = false;
                    btn.innerText = "استخراج كملف PDF 📥";
                });
            }, delay);
        }

        window.onload = () => {
            document.getElementById('html-input').value = defaultCode.trim();
            updatePreview();
        };
    </script>
</body>
</html>
