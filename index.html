<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML to PDF Tool</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body { font-family: Arial; background:#f4f6f8; margin:0; padding:15px; display:flex; flex-direction:column; height:100vh;}
.header {text-align:center;}
.main-container {display:flex; gap:10px; flex:1;}
.sidebar {background:#fff; padding:15px; flex:1; max-width:350px; overflow:auto;}
.preview-section {flex:2; background:#fff;}
textarea {width:100%; height:200px;}
button {cursor:pointer;}
.prompt-btns {display:flex; gap:5px; margin-bottom:5px;}
</style>
</head>

<body>

<div class="header">
<h2>🛠️ HTML → PDF</h2>
</div>

<div class="main-container">

<div class="sidebar">

<!-- Buttons -->
<div class="prompt-btns">
<button onclick="copyPrompt('a4')">📄 عربي بحث</button>
<button onclick="copyPrompt('169')">🖥️ عربي عرض</button>
</div>

<div class="prompt-btns">
<button onclick="copyPrompt('en_a4')">📄 English A4</button>
<button onclick="copyPrompt('en_169')">🖥️ English Slides</button>
</div>

<!-- Language -->
<label>اللغة:</label>
<select id="lang-select" onchange="updatePreview()">
<option value="ar">العربية</option>
<option value="en">English</option>
</select>

<br><br>

<input id="file-name" placeholder="اسم الملف"><br><br>

<select id="format-select">
<option value="169">16:9</option>
<option value="a4">A4</option>
</select>

<br><br>

<textarea id="html-input" oninput="updatePreview()"></textarea>

<br>

<button onclick="exportToPDF()">تحميل PDF</button>

</div>

<div class="preview-section">
<iframe id="preview-frame" style="width:100%;height:100%;border:none;"></iframe>
</div>

</div>

<script>

// ---------------- PROMPTS ----------------
const prompts = {

a4: `أنت مصمم وثائق HTML محترف...
(نفس برومبتك العربي)`,

169: `أنت مصمم عروض HTML محترف...
(نفس برومبتك العربي)`,

en_a4: `You are a professional HTML document designer...

Requirements:
- <html lang="en" dir="ltr">
- A4 pages
- No ul/ol
- Clean design`,

en_169: `You are a professional HTML presentation designer...

Requirements:
- <html lang="en" dir="ltr">
- Slides 1280x720
- No ul/ol
- Modern design`
};

// ---------------- COPY ----------------
function copyPrompt(type){
navigator.clipboard.writeText(prompts[type]);
alert("تم النسخ!");
}

// ---------------- PREVIEW ----------------
function updatePreview(){
let code = document.getElementById("html-input").value;
const lang = document.getElementById("lang-select").value;

if(lang==="en"){
code = code.replace(/dir="rtl"/g,"dir='ltr'")
           .replace(/text-align:\s*right/g,"text-align:left");
}

document.getElementById("preview-frame").srcdoc = code;
}

// ---------------- PDF ----------------
async function exportToPDF(){

const { jsPDF } = window.jspdf;
const code = document.getElementById("html-input").value;
const format = document.getElementById("format-select").value;

let w = format==="a4"?794:1280;
let h = format==="a4"?1123:720;

const container = document.createElement("div");
container.innerHTML = code;
document.body.appendChild(container);

const canvas = await html2canvas(container,{
scale:2,
useCORS:true
});

const img = canvas.toDataURL("image/jpeg");

const pdf = new jsPDF({
orientation: format==="a4"?"portrait":"landscape",
unit:"px",
format:[w,h]
});

pdf.addImage(img,"JPEG",0,0,w,h);
pdf.save("file.pdf");

document.body.removeChild(container);
}

</script>

</body>
</html>
