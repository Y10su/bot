<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل الأكواد إلى PDF</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; background: #f4f6f8; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 22px;}
        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .main-container { flex-direction: column; height: auto; overflow: visible; } body {height: auto; padding: 10px;} }
        
        .sidebar { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; display: flex; flex-direction: column; flex: 1; max-width: 420px; overflow-y: auto;}
        .preview-section { background: #fff; border-radius: 10px; padding: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; display: flex; flex-direction: column; flex: 2; overflow: hidden; }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #475569; }
        input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: inherit; transition: 0.2s;}
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .textarea-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .clear-btn { background: #fee2e2; color: #ef4444; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .clear-btn:hover { background: #fca5a5; color: #b91c1c; }
        
        textarea { flex: 1; min-height: 150px; resize: vertical; direction: ltr; font-family: monospace; background: #f8fafc; font-size: 12px;}
        
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row .form-group { flex: 1; min-width: 120px; }

        .ai-prompts { background: #f0fdf4; border: 1px dashed #22c55e; padding: 12px; border-radius: 8px; margin-bottom: 15px;}
        .ai-prompts p { margin: 0 0 8px 0; font-size: 12px; color: #166534; font-weight: bold; text-align: center;}
        .prompt-btns { display: flex; gap: 8px; margin-bottom: 8px; }
        .prompt-btns:last-child { margin-bottom: 0; }
        .prompt-btn { flex: 1; background: #fff; border: 1px solid #22c55e; color: #15803d; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; text-align: center;}
        .prompt-btn:hover { background: #22c55e; color: #fff; }

        .export-btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .export-btn:hover { background: #1d4ed8; transform: translateY(-1px);}
        .export-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none;}
        
        .preview-header { padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 14px; font-weight: bold; color: #475569; display: flex; justify-content: space-between; align-items: center;}
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 6px; font-size: 12px; transition: 0.3s;}
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div class="header">
        <h2>🛠️ منصة تحويل الأكواد إلى PDF</h2>
    </div>

    <div class="main-container">
        <div class="sidebar">
            
            <div class="ai-prompts">
                <p>🤖 نسخ أمر جاهز للذكاء الاصطناعي:</p>
                <div class="prompt-btns">
                    <button class="prompt-btn" onclick="copyPrompt('a4_ar', this)">📄 بحث عربي (A4)</button>
                    <button class="prompt-btn" onclick="copyPrompt('169_ar', this)">🖥️ عرض عربي (16:9)</button>
                </div>
                <div class="prompt-btns">
                    <button class="prompt-btn" style="border-color:#3b82f6; color:#1d4ed8;" onclick="copyPrompt('a4_en', this)">📄 English Paper (A4)</button>
                    <button class="prompt-btn" style="border-color:#3b82f6; color:#1d4ed8;" onclick="copyPrompt('169_en', this)">🖥️ English Pres. (16:9)</button>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الملف المستخرج:</label>
                <input type="text" id="file-name" value="مستند_جديد" placeholder="اكتب اسم الملف هنا...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>اتجاه المستند:</label>
                    <select id="dir-select">
                        <option value="rtl">عربي (RTL)</option>
                        <option value="ltr">إنجليزي (LTR)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المقاس:</label>
                    <select id="format-select" onchange="updateTag()">
                        <option value="169">عرض (16:9)</option>
                        <option value="a4">بحث (A4)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>الجودة:</label>
                    <select id="quality-select">
                        <option value="1">عادية</option>
                        <option value="2" selected>عالية</option>
                        <option value="3">ممتازة</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="flex: 1;">
                <div class="textarea-header">
                    <label style="margin:0;">كود الـ HTML (الصق هنا):</label>
                    <button class="clear-btn" onclick="clearCode()">🗑️ مسح الكود</button>
                </div>
                <textarea id="html-input" oninput="updatePreview()" placeholder="الصق الكود الذي أعطاك إياه الذكاء الاصطناعي هنا..."></textarea>
            </div>

            <button id="capture-btn" class="export-btn" onclick="exportToPDF()">استخراج كملف PDF 📥</button>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span>👁️ المعاينة المباشرة</span>
                <span class="tag" id="size-tag">الأبعاد: 1280 × 720</span>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const prompts = {
            a4_ar: `أنت مصمم وثائق HTML محترف. قم بإنشاء كود HTML كامل لبحث أكاديمي بالعربية وفق المواصفات التالية:

**عنوان البحث:** [اكتب العنوان هنا]
**المادة:** [المادة]
**الطالب:** [الاسم]
**المعلم:** [الاسم]
**عدد الصفحات المطلوبة:** [مثال: 5 صفحات]

**متطلبات تقنية صارمة جداً — لا تتجاوزها:**
1. يبدأ الكود بـ <html lang="ar" dir="rtl">.
2. استدعاء خطوط Google Fonts (مثل Cairo أو Tajawal).
3. الـ body يحتوي على: display: block; direction: rtl; text-align: right; margin: 0; padding: 0; box-sizing: border-box;
4. كل صفحة تكون: <div class="page">. أبعادها: width: 794px; height: 1123px; overflow: hidden; position: relative; box-sizing: border-box;
5. لا تستخدم القوائم الافتراضية (ul, ol). للنقاط، استخدم عناصر <p> أو <div> عادية وأضف النقطة يدوياً هكذا: <p>• النقطة الأولى</p>.
6. ممنوع استخدام letter-spacing نهائياً.

**هيكل البحث:** صفحة 1: غلاف احترافي. صفحة 2+: المحتوى. صفحة أخيرة: المراجع.`,
            
            169_ar: `أنت مصمم عروض HTML محترف. قم بإنشاء كود HTML كامل لعرض تقديمي بالعربية وفق المواصفات التالية:

**عنوان العرض:** [اكتب العنوان هنا]
**المادة / الموضوع:** [الموضوع]
**المقدِّم:** [الاسم]
**عدد الشرائح:** [مثال: 8 شرائح]

**متطلبات تقنية صارمة جداً — لا تتجاوزها:**
1. يبدأ الكود بـ <html lang="ar" dir="rtl">.
2. استدعاء خطوط Google Fonts صراحةً (مثل Cairo).
3. الـ body يحتوي على: display: block; direction: rtl; text-align: right; margin: 0; padding: 0; box-sizing: border-box;
4. كل شريحة تكون: <div class="page">. أبعادها: width: 1280px; height: 720px; overflow: hidden; position: relative; box-sizing: border-box;
5. لا تستخدم القوائم الافتراضية (ul, ol). للنقاط استخدم: <p>• النقطة الأولى</p>.
6. ممنوع استخدام letter-spacing نهائياً.

**الهيكل:** شريحة 1: غلاف. شرائح 2+: محتوى. نمط حديث، خلفيات ملونة ونصوص كبيرة.`,

            a4_en: `You are a professional HTML document designer. Create a complete HTML code for an English academic paper/report with the following details:

**Title:** [Write Title Here]
**Subject:** [Subject Name]
**Student:** [Name]
**Teacher:** [Name]
**Number of Pages:** [Example: 5 pages]

**Strict Technical Requirements — Do NOT violate:**
1. The code must start with: <html lang="en" dir="ltr">.
2. Explicitly import Google Fonts (such as Roboto or Open Sans).
3. The body must include: display: block; direction: ltr; text-align: left; margin: 0; padding: 0; box-sizing: border-box;
4. Each page must be: <div class="page"> with: width: 794px; height: 1123px; overflow: hidden; position: relative; box-sizing: border-box;
5. Do NOT use default lists (ul, ol). For bullet points, use regular <p> or <div> elements and add the bullet manually like: <p>• First point</p> or <p>1- First point</p>.
6. Do NOT use letter-spacing at all.

**Structure:** Page 1: Professional Cover. Pages 2+: Content. Last Page: References. Professional and elegant design.`,

            169_en: `You are a professional HTML presentation designer. Create a complete HTML code for an English presentation with the following details:

**Presentation Title:** [Write Title Here]
**Subject / Topic:** [Topic Name]
**Presenter:** [Name]
**Number of Slides:** [Example: 8 slides]

**Strict Technical Requirements — Do NOT violate:**
1. The code must start with: <html lang="en" dir="ltr">.
2. Explicitly import Google Fonts (such as Montserrat or Open Sans).
3. The body must include: display: block; direction: ltr; text-align: left; margin: 0; padding: 0; box-sizing: border-box;
4. Each slide must be: <div class="page"> with: width: 1280px; height: 720px; overflow: hidden; position: relative; box-sizing: border-box;
5. Do NOT use default lists (ul, ol). For bullet points, use regular <p> or <div> elements and add the bullet manually like: <p>• First point</p>.
6. Do NOT use letter-spacing at all.

**Slide Structure:** Slide 1: Cover (Big title + presenter name). Slides 2+: Organized content. Modern design, colorful backgrounds, large readable text.`
        };

        function copyPrompt(type, btnElement) {
            navigator.clipboard.writeText(prompts[type]).then(() => {
                const originalText = btnElement.innerText;
                const originalBg = btnElement.style.background;
                const originalColor = btnElement.style.color;

                btnElement.innerText = "✅ تم النسخ!";
                btnElement.style.background = "#22c55e";
                btnElement.style.color = "#fff";
                
                // تغيير اتجاه الإعدادات تلقائياً حسب لغة البرومبت المنسوخ
                if(type.includes('_en')) {
                    document.getElementById('dir-select').value = 'ltr';
                } else {
                    document.getElementById('dir-select').value = 'rtl';
                }
                
                // تغيير المقاس تلقائياً
                if(type.includes('a4')) {
                    document.getElementById('format-select').value = 'a4';
                } else {
                    document.getElementById('format-select').value = '169';
                }
                updateTag();

                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = originalBg;
                    btnElement.style.color = originalColor;
                }, 2000);
            });
        }

        function clearCode() {
            if(confirm("هل أنت متأكد من مسح الكود الحالي؟")) {
                document.getElementById('html-input').value = '';
                updatePreview();
            }
        }

        function updateTag() {
            const format = document.getElementById('format-select').value;
            const tag = document.getElementById('size-tag');
            if(format === 'a4') {
                tag.innerText = "الأبعاد: 794 × 1123 (A4)";
            } else {
                tag.innerText = "الأبعاد: 1280 × 720 (16:9)";
            }
        }

        function updatePreview() {
            const code = document.getElementById('html-input').value;
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = code;
        }

        async function urlToDataURL(url) {
            if (url && (url.startsWith('data:') || url.startsWith('blob:'))) return url;
            
            let absoluteUrl = url;
            try {
                if (!url.startsWith('http://') && !url.startsWith('https://') && !url.startsWith('//')) {
                    absoluteUrl = new URL(url, window.location.href).href;
                } else if (url.startsWith('//')) {
                    absoluteUrl = 'https:' + url;
                }
            } catch(e) {
                absoluteUrl = url;
            }
            
            const proxies = [
                null,
                'https://corsproxy.io/?',
                'https://api.allorigins.win/raw?url=',
                'https://cors-anywhere.herokuapp.com/'
            ];
            
            for (const proxy of proxies) {
                try {
                    let fetchUrl = absoluteUrl;
                    if (proxy) fetchUrl = proxy + encodeURIComponent(absoluteUrl);
                    const response = await fetch(fetchUrl, { mode: 'cors', credentials: 'omit' });
                    if (!response.ok) continue;
                    const blob = await response.blob();
                    return await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.onerror = () => resolve(null);
                        reader.readAsDataURL(blob);
                    });
                } catch (err) {
                    console.warn(`فشل الجلب باستخدام ${proxy || 'مباشر'} للصورة: ${absoluteUrl}`, err);
                }
            }
            
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    try {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', 0.9));
                    } catch(e) {
                        console.warn("فشل تحويل الصورة عبر Canvas", e);
                        resolve(null);
                    }
                };
                img.onerror = () => resolve(null);
                img.src = absoluteUrl;
                setTimeout(() => resolve(null), 5000); 
            });
        }
        
        async function convertAllImagesToDataURLs(container) {
            const images = Array.from(container.querySelectorAll('img'));
            const promises = images.map(async (img) => {
                const src = img.getAttribute('src');
                if (!src) return;
                if (src.startsWith('data:')) return;
                
                const dataUrl = await urlToDataURL(src);
                if (dataUrl) {
                    img.setAttribute('src', dataUrl);
                    img.setAttribute('data-original-src', src); 
                }
            });
            await Promise.all(promises);
        }
        
        async function exportToPDF() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const fileName = document.getElementById('file-name').value || 'document';
            const qualityScale = parseInt(document.getElementById('quality-select').value);
            const formatType = document.getElementById('format-select').value;
            const docDirection = document.getElementById('dir-select').value;

            if (!code.trim()) { alert("الرجاء لصق الكود أولاً!"); return; }

            let docWidth, docHeight, pdfOrientation;
            if (formatType === 'a4') {
                docWidth = 794;
                docHeight = 1123;
                pdfOrientation = 'portrait';
            } else { 
                docWidth = 1280;
                docHeight = 720;
                pdfOrientation = 'landscape';
            }

            btn.disabled = true;
            btn.innerText = `⏳ جاري تجهيز الصفحات...`;

            const hiddenContainer = document.createElement('div');
            // تعيين اتجاه الصفحة بناءً على الخيار المحدد
            hiddenContainer.dir = docDirection; 
            hiddenContainer.style.position = 'absolute';
            hiddenContainer.style.top = '0';
            hiddenContainer.style.left = '0';
            hiddenContainer.style.zIndex = '-9999';
            hiddenContainer.style.opacity = '0.01'; 
            hiddenContainer.style.pointerEvents = 'none';
            hiddenContainer.style.width = docWidth + 'px'; 
            hiddenContainer.innerHTML = code;
            
            const styleFix = document.createElement('style');
            // إصلاح التنسيقات لتتوافق مع كلا الاتجاهين
            styleFix.innerHTML = `
                ul { list-style-type: none !important; padding-right: 0 !important; padding-left: 0 !important; }
                ul li::before { content: "• " !important; font-weight: bold; margin: 0 5px; color: inherit; }
                ol { list-style-type: none !important; padding-right: 0 !important; padding-left: 0 !important; counter-reset: item; }
                ol li { counter-increment: item; }
                ol li::before { content: counter(item) "- " !important; font-weight: bold; margin: 0 5px; color: inherit; }
                * { box-sizing: border-box !important; letter-spacing: normal !important; }
                img { max-width: 100%; height: auto; }
            `;
            hiddenContainer.appendChild(styleFix);
            
            document.body.appendChild(hiddenContainer);

            try {
                btn.innerText = `🖼️ تحويل جميع الصور إلى DataURL...`;
                await convertAllImagesToDataURLs(hiddenContainer);
                
                await document.fonts.ready;
                
                const allImages = hiddenContainer.querySelectorAll('img');
                await Promise.all(Array.from(allImages).map(img => {
                    if (img.complete && img.naturalHeight > 0) return Promise.resolve();
                    return new Promise((resolve) => {
                        img.onload = () => resolve();
                        img.onerror = () => resolve();
                        if (img.complete) resolve();
                        setTimeout(resolve, 3000);
                    });
                }));
                
                btn.innerText = "📸 جاري تصوير الصفحات...";
                const { jsPDF } = window.jspdf;
                
                const pdf = new jsPDF({ orientation: pdfOrientation, unit: 'px', format: [docWidth, docHeight] });
                
                let pages = hiddenContainer.querySelectorAll('.page');
                if (pages.length === 0) pages = [hiddenContainer];
                
                for (let i = 0; i < pages.length; i++) {
                    const canvas = await html2canvas(pages[i], {
                        scale: qualityScale,
                        useCORS: true,
                        allowTaint: false,
                        logging: false,
                        width: docWidth,
                        height: docHeight,
                        windowWidth: docWidth,
                        windowHeight: docHeight,
                        x: 0,
                        y: 0,
                        scrollX: 0,
                        scrollY: 0,
                        backgroundColor: '#ffffff',
                        letterRendering: false,
                        onclone: (clonedDoc) => {
                            const clonedImages = clonedDoc.querySelectorAll('img');
                            clonedImages.forEach((clonedImg, idx) => {
                                if (allImages[idx] && allImages[idx].src.startsWith('data:')) {
                                    clonedImg.src = allImages[idx].src;
                                }
                            });
                        }
                    });
                    
                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    if (i > 0) pdf.addPage([docWidth, docHeight], pdfOrientation);
                    pdf.addImage(imgData, 'JPEG', 0, 0, docWidth, docHeight);
                }
                
                btn.innerText = "💾 حفظ الملف...";
                pdf.save(`${fileName}.pdf`);
                
            } catch (error) {
                console.error("خطأ:", error);
                alert("حدث خطأ أثناء معالجة الملف. تأكد من صحة الكود وأن جميع الصور قابلة للتحميل.");
            } finally {
                document.body.removeChild(hiddenContainer);
                btn.disabled = false;
                btn.innerText = "استخراج كملف PDF 📥";
            }
        }
    </script>
</body>
</html>
