<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إرسال البيانات وتحميل الملف</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* متطلبات تقنية صارمة للـ body */
        body {
            display: block;
            direction: rtl;
            text-align: right;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            background-color: #eef2f3;
            font-family: 'Tajawal', sans-serif;
        }

        /* متطلبات تقنية صارمة للشريحة / الصفحة */
        .page {
            width: 1280px;
            height: 720px;
            overflow: hidden;
            position: relative;
            box-sizing: border-box;
            background-color: #ffffff;
            margin: 40px auto;
            padding: 70px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 50px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .instructions {
            font-size: 24px;
            color: #7f8c8d;
            margin-bottom: 40px;
            text-align: center;
        }

        /* تصميم النموذج */
        form {
            width: 600px;
            background-color: #f8f9fa;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #e0e0e0;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 22px;
            font-weight: 700;
            color: #34495e;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 15px;
            font-size: 20px;
            font-family: 'Tajawal', sans-serif;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        input[type="text"]:focus, input[type="email"]:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 20px;
            font-size: 24px;
            font-weight: 800;
            font-family: 'Tajawal', sans-serif;
            color: #ffffff;
            background-color: #3498db;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* رسالة التحميل المخفية */
        #loadingMessage {
            display: none;
            font-size: 22px;
            color: #e67e22;
            font-weight: 700;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="page">
        <h1>سجل بياناتك للحصول على الملف</h1>
        
        <div class="instructions">
            <div>يرجى إدخال بياناتك أدناه.</div>
            <div>سيتم تحويلك إلى ملف الـ PDF (الخفيف والمضغوط) تلقائياً بعد الإرسال.</div>
        </div>

        <form id="dataForm">
            <div class="input-group">
                <label for="userName">الاسم الكريم:</label>
                <input type="text" id="userName" name="userName" required placeholder="أدخل اسمك هنا">
            </div>

            <div class="input-group">
                <label for="userEmail">البريد الإلكتروني:</label>
                <input type="email" id="userEmail" name="userEmail" required placeholder="example@email.com">
            </div>

            <button type="submit" id="submitBtn">إرسال والحصول على الملف</button>
            
            <div id="loadingMessage">جاري إرسال البيانات وتحضير الملف... الرجاء الانتظار</div>
        </form>
    </div>

    <script>
        // الكود المسؤول عن الإرسال للبوت ثم التحويل للملف
        document.getElementById('dataForm').addEventListener('submit', async function(event) {
            // منع التحديث الفوري للصفحة
            event.preventDefault();

            // روابطك (قم بتعديلها بروابطك الحقيقية)
            const botWebhookUrl = "https://api.example.com/bot-url"; // رابط البوت الخاص بك
            const lightPdfUrl = "https://example.com/your-light-file.pdf"; // رابط ملف الـ PDF المضغوط

            // عناصر الواجهة للتحكم بها
            const submitBtn = document.getElementById('submitBtn');
            const loadingMessage = document.getElementById('loadingMessage');
            
            // جمع البيانات من النموذج
            const formData = new FormData(this);

            // إظهار رسالة التحميل وتعطيل الزر لمنع الضغط المتكرر
            submitBtn.disabled = true;
            submitBtn.style.backgroundColor = "#95a5a6";
            loadingMessage.style.display = "block";

            try {
                // إرسال البيانات للبوت
                const response = await fetch(botWebhookUrl, {
                    method: 'POST',
                    body: formData
                });

                // التحقق من نجاح الإرسال للبوت
                if (response.ok) {
                    // تحويل المستخدم لملف الـ PDF فوراً بعد نجاح الإرسال
                    window.location.href = lightPdfUrl;
                } else {
                    alert("عذراً، حدث خطأ أثناء التسجيل. لم يتم تحويلك للملف.");
                    // إعادة تفعيل الزر في حال الخطأ
                    submitBtn.disabled = false;
                    submitBtn.style.backgroundColor = "#3498db";
                    loadingMessage.style.display = "none";
                }
            } catch (error) {
                alert("تأكد من اتصالك بالإنترنت، لا يمكن الوصول للخادم.");
                // إعادة تفعيل الزر في حال الخطأ
                submitBtn.disabled = false;
                submitBtn.style.backgroundColor = "#3498db";
                loadingMessage.style.display = "none";
            }
        });
    </script>

</body>
</html>
