<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع أزرار أحبك سلطان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #d63384;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .btn {
            background: linear-gradient(145deg, #ff6b6b, #ff8e8e);
            border: none;
            border-radius: 15px;
            color: white;
            padding: 15px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            background: linear-gradient(145deg, #ff5252, #ff7979);
        }
        
        .btn:active {
            transform: translateY(2px);
        }
        
        .message-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-top: 20px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .message {
            font-size: 2rem;
            color: #d63384;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .message.show {
            opacity: 1;
        }
        
        .heart {
            color: #ff6b6b;
            display: inline-block;
            animation: heartbeat 1.5s ease-in-out infinite;
        }
        
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        
        footer {
            margin-top: 30px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>موقع أزرار الحب <span class="heart">❤</span></h1>
        
        <div class="buttons-container">
            <button class="btn">الزر 1</button>
            <button class="btn">الزر 2</button>
            <button class="btn">الزر 3</button>
            <button class="btn">الزر 4</button>
            <button class="btn">الزر 5</button>
            <button class="btn">الزر 6</button>
            <button class="btn">الزر 7</button>
            <button class="btn">الزر 8</button>
        </div>
        
        <div class="message-container">
            <div class="message" id="message">أحبك سلطان</div>
        </div>
    </div>
    
    <footer>صمم خصيصًا لسلطان ❤</footer>

    <script>
        // الحصول على جميع الأزرار وعنصر الرسالة
        const buttons = document.querySelectorAll('.btn');
        const message = document.getElementById('message');
        
        // إضافة حدث النقر لكل زر
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                // إخفاء الرسالة أولاً ثم إظهارها بعد فترة بسيطة للتحريك
                message.classList.remove('show');
                
                setTimeout(() => {
                    message.textContent = 'أحبك سلطان';
                    message.classList.add('show');
                }, 300);
            });
        });
    </script>
</body>
</html>
