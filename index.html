        font-size: 1.1em;

    .search-box {
        background: white;

        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        margin-bottom: 30px;
    }

        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    #searchInput {
        flex: 1;
        padding: 15px 20px;

        border: 2px solid #667eea;
        border-radius: 10px;
        outline: none;
        transition: all 0.3s;
    }

    #searchInput:focus {
        border-color: #764ba2;
        box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.1);
    }

    .search-btn {
        padding: 15px 40px;
        font-size: 1.1em;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.2s;
        font-weight: bold;
    }

    .search-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .filter-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }

    .filter-btn {
        padding: 10px 20px;
        background: #f0f0f0;
        border: 2px solid transparent;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9em;
    }

    .filter-btn:hover {
        background: #e0e0e0;
    }

    .filter-btn.active {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-color: #667eea;
    }

    .results-container {
        background: white;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        min-height: 400px;
    }

    .result-item {
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 10px;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-right: 5px solid #667eea;
        transition: transform 0.2s;
    }

    .result-item:hover {
        transform: translateX(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .result-chapter {
        color: #667eea;
        font-weight: bold;
        font-size: 0.9em;
        margin-bottom: 5px;
    }

    .result-question {
        font-size: 1.1em;
        font-weight: bold;
        margin-bottom: 10px;
        color: #333;
    }

    .result-answer {
        color: #28a745;
        font-weight: bold;
        padding: 10px;
        background: rgba(40, 167, 69, 0.1);
        border-radius: 5px;
        margin-top: 10px;
    }

    .result-context {
        color: #666;
        font-size: 0.95em;
        margin-top: 10px;
        line-height: 1.6;
    }

    .no-results {
        text-align: center;
        padding: 60px 20px;
        color: #999;
    }

    .no-results svg {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        opacity: 0.3;
    }

    .stats {
        text-align: center;
        color: #666;
        margin-bottom: 20px;
        font-size: 0.95em;
    }

    .highlight {
        background: yellow;
        padding: 2px 4px;
        border-radius: 3px;
        font-weight: bold;
    }

    .loading {
        text-align: center;
        padding: 40px;
        color: #667eea;
    }

    .loading::after {
        content: '...';
        animation: dots 1.5s infinite;
    }

    @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }

    let currentFilter = 'all';
    let allResults = [];

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            search();
        }
    });

    function filterChapter(chapter) {
        currentFilter = chapter;
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        displayResults(allResults);
    }

    function search() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('results');

        if (!query) {
            resultsDiv.innerHTML = `
                <div class="no-results">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <h3>الرجاء إدخال كلمة بحث</h3>
                    <p>اكتب في صندوق البحث أعلاه للعثور على الأسئلة والإجابات</p>
                </div>
            `;
            return;
        }

        resultsDiv.innerHTML = '<div class="loading">جاري البحث</div>';

        setTimeout(() => {
            allResults = data.filter(item => {
                const searchText = query.toLowerCase();
                return item.question.toLowerCase().includes(searchText) ||
                       item.answer.toLowerCase().includes(searchText) ||
                       item.chapter.toLowerCase().includes(searchText);
            });

            displayResults(allResults);
        }, 300);
    }

    function displayResults(results) {
        const resultsDiv = document.getElementById('results');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        let filteredResults = results;
        if (currentFilter !== 'all') {
            filteredResults = results.filter(item => item.chapter === currentFilter);
        }

        if (filteredResults.length === 0) {
            resultsDiv.innerHTML = `
                <div class="no-results">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <h3>لم يتم العثور على نتائج</h3>
                    <p>حاول استخدام كلمات بحث مختلفة</p>
                </div>
            `;
            return;
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        let html = `<div class="stats">تم العثور على ${filteredResults.length} نتيجة</div>`;

        filteredResults.forEach(item => {
            const highlightedQuestion = highlightText(item.question, query);
            const highlightedAnswer = highlightText(item.answer, query);

            html += `
                <div class="result-item">
                    <div class="result-chapter">${item.chapter}</div>
                    <div class="result-question">${highlightedQuestion}</div>
                    <div class="result-answer">✓ الإجابة: ${highlightedAnswer}</div>
                </div>
            `;
        });

        resultsDiv.innerHTML = html;
    }
