    let currentFilter = 'all';
    let allResults = [];
    let quizMode = false;
    let quizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedAnswers = [];

    document.getElementById('searchInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            search();
        }
    });

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.querySelector('.theme-toggle');
        btn.textContent = document.body.classList.contains('dark-mode') ? '☀️' : '🌙';
    }

    function filterChapter(chapter) {
        currentFilter = chapter;
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.classList.add('active');
        if (!quizMode) {
            displayResults(allResults);
        }
    }

    function search() {
        const query = document.getElementById('searchInput').value.trim();
        const resultsDiv = document.getElementById('results');
        quizMode = false;

        if (!query) {
            resultsDiv.innerHTML = `
                <div class="no-results">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <h3>الرجاء إدخال كلمة بحث</h3>
                    <p>اكتب في صندوق البحث أعلاه للعثور على الأسئلة والإجابات</p>
                </div>
            `;
            return;
        }

        resultsDiv.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-primary)">جاري البحث...</div>';

        setTimeout(() => {
            allResults = data.filter(item => {
                const searchText = query.toLowerCase();
                return item.question.toLowerCase().includes(searchText) ||
                       item.answer.toLowerCase().includes(searchText) ||
                       item.chapter.toLowerCase().includes(searchText);
            });

            displayResults(allResults);
        }, 300);
    }

    function displayResults(results) {
        const resultsDiv = document.getElementById('results');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();

        let filteredResults = results;
        if (currentFilter !== 'all') {
            filteredResults = results.filter(item => item.chapter === currentFilter);
        }

        if (filteredResults.length === 0) {
            resultsDiv.innerHTML = `
                <div class="no-results">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                    <h3>لم يتم العثور على نتائج</h3>
                    <p>حاول استخدام كلمات بحث مختلفة</p>
                </div>
            `;
            return;
        }

        function highlightText(text, query) {
            if (!query) return text;
            const regex = new RegExp(`(${query})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        let html = `<div class="stats">تم العثور على ${filteredResults.length} نتيجة</div>`;

        filteredResults.forEach(item => {
            const highlightedQuestion = highlightText(item.question, query);
            const highlightedAnswer = highlightText(item.answer, query);

            html += `
                <div class="result-item">
                    <div class="result-chapter">${item.chapter}</div>
                    <div class="result-question">${highlightedQuestion}</div>
                    <div class="result-answer">✓ الإجابة: ${highlightedAnswer}</div>
                </div>
            `;
        });

        resultsDiv.innerHTML = html;
    }

    function startQuiz() {
        quizMode = true;
        currentQuestionIndex = 0;
        score = 0;
        selectedAnswers = [];

        let availableQuestions = currentFilter === 'all' 
            ? [...data] 
            : data.filter(item => item.chapter === currentFilter);

        quizQuestions = [];
        const shuffled = availableQuestions.sort(() => 0.5 - Math.random());
        quizQuestions = shuffled.slice(0, Math.min(20, shuffled.length));

        displayQuiz();
    }

    function displayQuiz() {
        const resultsDiv = document.getElementById('results');
        
        if (currentQuestionIndex >= quizQuestions.length) {
            showQuizResult();
            return;
        }

        const question = quizQuestions[currentQuestionIndex];
        const shuffledOptions = [...question.options].sort(() => 0.5 - Math.random());

        let html = `
            <div class="quiz-header">
                <div class="quiz-progress">السؤال ${currentQuestionIndex + 1} من ${quizQuestions.length}</div>
                <div class="quiz-score">النقاط: ${score}</div>
            </div>
            <div class="quiz-question">
                <div class="result-chapter">${question.chapter}</div>
                <div class="quiz-question-text">${question.question}</div>
                <div class="quiz-options">
        `;

        shuffledOptions.forEach((option, index) => {
            html += `
                <div class="quiz-option" onclick="selectAnswer('${option}', '${question.answer}')" id="option-${index}">
                    ${option}
                </div>
            `;
        });

        html += `
                </div>
            </div>
            <div class="quiz-navigation">
                <button class="btn" onclick="nextQuestion()" id="nextBtn" style="display:none">السؤال التالي</button>
            </div>
        `;

        resultsDiv.innerHTML = html;
    }

    function selectAnswer(selected, correct) {
        const options = document.querySelectorAll('.quiz-option');
        options.forEach(option => {
            option.style.pointerEvents = 'none';
            if (option.textContent.trim() === correct) {
                option.classList.add('correct');
            }
            if (option.textContent.trim() === selected && selected !== correct) {
                option.classList.add('wrong');
            }
        });

        if (selected === correct) {
            score++;
            document.querySelector('.quiz-score').textContent = `النقاط: ${score}`;
        }

        selectedAnswers.push({
            question: quizQuestions[currentQuestionIndex].question,
            selected: selected,
            correct: correct,
            isCorrect: selected === correct
        });

        document.getElementById('nextBtn').style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        displayQuiz();
    }

    function showQuizResult() {
        const resultsDiv = document.getElementById('results');
        const percentage = ((score / quizQuestions.length) * 100).toFixed(1);
        
        let grade = '';
        if (percentage >= 90) grade = 'ممتاز 🌟';
        else if (percentage >= 80) grade = 'جيد جداً 👍';
        else if (percentage >= 70) grade = 'جيد ✓';
        else if (percentage >= 60) grade = 'مقبول 📝';
        else grade = 'يحتاج تحسين 📚';

        let html = `
            <div class="quiz-result">
                <h2>انتهى الاختبار! 🎉</h2>
                <p>النتيجة: ${score} من ${quizQuestions.length}</p>
                <p>النسبة المئوية: ${percentage}%</p>
                <p>التقدير: ${grade}</p>
                <button class="btn" onclick="startQuiz()" style="margin-top:20px">اختبار جديد</button>
                <button class="btn" onclick="showQuizReview()" style="margin-top:20px;background:linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)">مراجعة الإجابات</button>
            </div>
        `;

        resultsDiv.innerHTML = html;
    }

    function showQuizReview() {
        const resultsDiv = document.getElementById('results');
        
        let html = '<div class="stats">مراجعة الإجابات</div>';
        
        selectedAnswers.forEach((item, index) => {
            const icon = item.isCorrect ? '✅' : '❌';
            html += `
                <div class="result-item">
                    <div class="result-chapter">السؤال ${index + 1} ${icon}</div>
                    <div class="result-question">${item.question}</div>
                    ${!item.isCorrect ? `<div style="color:#dc3545;padding:10px;background:rgba(220,53,69,0.1);border-radius:5px;margin-top:10px">إجابتك: ${item.selected}</div>` : ''}
                    <div class="result-answer">✓ الإجابة الصحيحة: ${item.correct}</div>
                </div>
            `;
        });

        html += `
            <div style="text-align:center;margin-top:20px">
                <button class="btn" onclick="startQuiz()">اختبار جديد</button>
            </div>
        `;

        resultsDiv.innerHTML = html;
    }
</script>
